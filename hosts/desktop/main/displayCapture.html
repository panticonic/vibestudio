<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose what to share</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px system-ui,
          sans-serif;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header,
      footer {
        padding: 20px 24px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        margin: 8px 0;
      }
      #sources {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 14px;
        padding: 12px 24px;
        align-content: start;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid GrayText;
        border-radius: 8px;
        padding: 10px 18px;
      }
      button:focus-visible {
        outline: 3px solid Highlight;
        outline-offset: 3px;
      }
      .source {
        padding: 8px;
        text-align: left;
      }
      .source[aria-pressed="true"] {
        outline: 3px solid Highlight;
      }
      .source img {
        width: 100%;
        height: 125px;
        object-fit: contain;
        background: #8882;
      }
      .source span {
        display: block;
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      footer {
        border-top: 1px solid GrayText;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }
      #share {
        background: Highlight;
        color: HighlightText;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Choose what to share</h1>
      <p id="origin"></p>
    </header>
    <div id="sources" aria-label="Available screens and windows"></div>
    <footer>
      <p id="status" role="status">Loading screens and windows…</p>
      <label id="audio-row" hidden><input type="checkbox" id="audio" /> Share system audio</label>
      <div class="actions">
        <button id="cancel">Cancel</button><button id="share" disabled>Share</button>
      </div>
    </footer>
  </body>
</html>
