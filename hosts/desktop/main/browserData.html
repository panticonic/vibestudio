<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Browser data</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --text: #202124;
        --muted: #666b74;
        --border: #e4e5e9;
        --surface: #f7f8fa;
        --accent: #3e63dd;
        --danger: #b42332;
      }
      :root[data-dark="true"] {
        color-scheme: dark;
        --bg: #191b20;
        --text: #eef0f4;
        --muted: #a1a7b3;
        --border: #343842;
        --surface: #23262e;
        --accent: #9eafff;
        --danger: #ff9ba4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px/1.5 system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      main {
        padding: 16px 20px 28px;
        max-width: 900px;
        margin: auto;
      }
      h2 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 6px;
      }
      h3 {
        font-size: 15px;
        margin: 24px 0 8px;
      }
      p {
        margin: 6px 0;
      }
      button,
      input,
      select {
        font: inherit;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: inherit;
        min-height: 34px;
      }
      input {
        min-width: 0;
      }
      button {
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary {
        color: var(--accent);
      }
      button.danger {
        color: var(--danger);
      }
      .toolbar,
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .toolbar {
        margin-top: 12px;
      }
      .row {
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid var(--border);
      }
      .row-label {
        min-width: 140px;
        flex: 1;
        overflow-wrap: anywhere;
      }
      .row input {
        flex: 1;
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      .status-card {
        margin: 18px 0;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .status-card strong {
        display: block;
      }
      .form {
        display: grid;
        gap: 8px;
        margin: 12px 0 20px;
      }
      .form label {
        display: grid;
        gap: 4px;
      }
      .form .toolbar {
        margin: 0;
      }
      details {
        margin-top: 18px;
      }
      summary {
        cursor: pointer;
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        background: var(--surface);
        padding: 12px;
        border-radius: 6px;
      }
      #workspace {
        margin: 0 0 14px;
        font-size: 12px;
      }
      #status:empty {
        display: none;
      }
      #status {
        margin: 0 0 12px;
      }
      dialog {
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
      }
      dialog::backdrop {
        background: #0007;
      }
      dialog .toolbar {
        justify-content: flex-end;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="workspace" class="muted"></p>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="content" aria-busy="true"><p class="muted">Loading browser data…</p></section>
    </main>
    <dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <form method="dialog">
        <h2 id="confirm-title">Confirm change</h2>
        <p id="confirm-message"></p>
        <div class="toolbar">
          <button value="cancel" autofocus>Cancel</button
          ><button class="danger" value="confirm">Continue</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
