nodeLinker: hoisted
engineStrict: true

# Keep the native release payloads available to staging and conformance checks.
# Desktop packaging selects the current architecture and runs its installed
# compiler/runtime closure on a matching native runner.
supportedArchitectures:
  os:
    - current
  cpu:
    - x64
    - arm64
  libc:
    - glibc

packages:
  - "packages/*"
  - "apps/*"
