systemEpoch: 0
template:
  name: vibestudio-dev
  description: Private error overview, report investigation, and self-development.
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-system.git
  repositories:
    - meta
    - panels/error-dashboard
    - workers/error-reports
    - skills/error-investigation
services:
  - name: error-reports
    title: Error reports
    description: Developer-authenticated reporting queries through host-held credentials.
    action: investigate reported problems
    source: workers/error-reports
    protocols: [vibestudio.error-reports.v1]
    durableObject:
      className: ErrorReportsDO
    authority:
      binding: declared
      principals: [host, user, code]
    presentation:
      domain: automation
      verb: manage
    notability: everyday
singletonObjects:
  - source: workers/error-reports
    className: ErrorReportsDO
    key: error-reports
