appId: app.vibestudio.app
beforePack: ./scripts/stage-electron-native-isolation.mjs
onNodeModuleFile: ./scripts/electron-runtime-module-files.mjs
productName: Vibestudio

directories:
  output: release
  buildResources: build-resources

files:
  - "dist/**/*"
  - "!dist/node/**/*"
  - "!dist/host-generations/**/*"
  - "!dist/source-server-prerequisites.lock"
  - "!dist/host-build.lock"
  - "scripts/cli/**/*"
  - "packages/**/*"
  - "node_modules/**/*"
  - "package.json"

asar: true
asarUnpack:
  # Desktop phone provisioning executes the canonical CLI primitives locally.
  - "scripts/cli/**/*"
  - "package.json"
  # MXC enforcement payloads must be executable outside ASAR.
  - "dist/mxc/**/*"
  # Worker threads resolve their entries beside the physical server bundle.
  - "dist/*-worker.cjs"
  # Linked provider hooks and MCP run the installed CLI with the native runtime.
  - "dist/cli/**/*"
  # utilityProcess.fork() needs a physical server entry point.
  - "dist/server-electron.cjs"
  # Spawned after startup for low-priority dependency content maintenance.
  - "dist/dependency-content-maintenance.cjs"
  # Server auto-spawn uses child_process.fork() for the standalone headless host.
  - "dist/headless-host/**/*"
  # Runtime panel/worker builds use esbuild against installed packages. Keep
  # node_modules on the real filesystem so package resolution and native
  # executables do not cross ASAR virtual paths.
  - "node_modules/**/*"
  # @vibestudio packages need to be unpacked for panel builds.
  - "packages/**/*"

extraResources:
  # Reviewed first-party mission charters. These are admission inputs; runtime
  # code resolves only their @seed pins from the immutable product snapshot.
  - from: "seed"
    to: "seed"
    filter:
      - "missions/*.json"
  # Exact external Base release pointer. The Base source itself is never
  # packaged; first-run acquisition uses only this immutable coordinate.
  - from: "build-resources/base-template-release.json"
    to: "base-template-release.json"
  # Pre-built shipped panels
  - from: "dist/shipped-panels"
    to: "shipped-panels"
    filter:
      - "**/*"
  # Pre-built about pages
  - from: "dist/about-pages"
    to: "about-pages"
    filter:
      - "**/*"
  # Pre-built builtin workers
  - from: "dist/builtin-workers"
    to: "builtin-workers"
    filter:
      - "**/*"
  # Optional app dist bake. This directory is intentionally empty unless an
  # approved app build has been explicitly baked for standalone packaging.
  - from: "dist/baked-app"
    to: "baked-app"
    filter:
      - "**/*"

# macOS configuration
mac:
  # Preserve the stock distribution, independent of node_modules filtering.
  extraResources:
    - from: "dist/node"
      to: "app.asar.unpacked/dist/node"
      filter:
        - "darwin-${arch}/**/*"
  minimumSystemVersion: "14.0.0"
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  icon: build-resources/icon.icns
  extendInfo:
    NSCameraUsageDescription: "Allow websites you approve in Vibestudio to use the camera."
    NSMicrophoneUsageDescription: "Allow websites you approve in Vibestudio to use the microphone."
    NSLocationWhenInUseUsageDescription: "Allow websites you approve in Vibestudio to use your location."

# DMG configuration
dmg:
  background: build-resources/dmg-background.png
  iconSize: 96
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  # Preserve the stock distribution, independent of node_modules filtering.
  # The official Node payload must remain byte-for-byte unchanged; sign the
  # application and other native helpers, but exclude this vendor executable.
  signExts:
    - "!node.exe"
  extraResources:
    - from: "dist/node"
      to: "app.asar.unpacked/dist/node"
      filter:
        - "win32-${arch}/**/*"
  target:
    - target: nsis
      arch:
        - x64
  icon: build-resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  shortcutName: Vibestudio

# Linux configuration
linux:
  # Preserve the stock distribution, independent of node_modules filtering.
  extraResources:
    - from: "dist/node"
      to: "app.asar.unpacked/dist/node"
      filter:
        - "linux-${arch}/**/*"
    # The deb maintainer scripts install this into /etc/apparmor.d.
    - from: "build-resources/apparmor"
      to: "apparmor"
  synopsis: Stacked panel workspace for agentic workflows
  description: Vibestudio is a branded desktop and mobile workspace for horizontally stacked panels, local runtime surfaces, and secure paired workspace access.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    # Fedora/RHEL and openSUSE. The AppArmor profile installs only where
    # /etc/apparmor.d exists, so an SELinux host is unaffected by it.
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
  category: Development
  icon: build-resources/icons

# Ubuntu 24.04+ denies unprivileged user namespaces to binaries shipping no
# AppArmor profile, and a workspace runtime cannot sandbox without one. Every
# packaged Linux format installs that profile so a fresh install just works,
# rather than asking the reader to weaken
# kernel.apparmor_restrict_unprivileged_userns for their whole machine. The
# scripts no-op where AppArmor is absent, so SELinux hosts are unaffected.
deb:
  afterInstall: build-resources/linux/after-install.sh
  afterRemove: build-resources/linux/after-remove.sh

rpm:
  afterInstall: build-resources/linux/after-install.sh
  afterRemove: build-resources/linux/after-remove.sh

pacman:
  afterInstall: build-resources/linux/after-install.sh
  afterRemove: build-resources/linux/after-remove.sh

# Auto-update configuration
publish:
  provider: github
  owner: panticonic
  repo: vibestudio
  releaseType: release

# Reject an Electron app bundle if the deleted in-tree workspace or an
# external-Base source projection is ever reintroduced by packaging changes.
afterPack: ./scripts/electron-after-pack.mjs
