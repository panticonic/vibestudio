name = "vibestudio-webhook-relay"
main = "src/index.ts"
compatibility_date = "2024-11-15"

# Counters retain aggregate data only; do not persist per-request invocation metadata.
[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = false

[assets]
directory = "../../dist/apex-website-assets"

# Deploy as its own Worker.
#
#   cd apps/webhook-relay
#   wrangler deploy
#
# Universal-link host (mobile OAuth deep-link). Set as plain vars or secrets:
#   VIBESTUDIO_APPLE_APP_ID                      e.g. ABCDE12345.app.vibestudio.mobile (comma-separated for multiple)
#   VIBESTUDIO_ANDROID_PACKAGE_NAME              e.g. app.vibestudio.mobile
#   VIBESTUDIO_ANDROID_SHA256_CERT_FINGERPRINTS  uppercase colon-separated, comma-separated for multiple
#
# VIBESTUDIO_SERVER_BASE_URL is GONE — routing is multi-tenant now: each home
# workspace holds one authenticated backhaul WebSocket (/backhaul) into the
# global RelayRegistry DO and claims its own subscriptionIds
# (first-writer-wins). Authentication uses its persistent P-256 identity.
#
# account_id is environment-specific. Set CLOUDFLARE_ACCOUNT_ID in the deploy
# shell or CI environment.

[vars]
ENVIRONMENT = "production"

# Single apex host for pairing, app-link verification, OAuth callbacks,
# webhook ingress, and relay backhaul:
#   https://vibestudio.app/
[[routes]]
pattern = "vibestudio.app"
custom_domain = true

# Multi-tenant registry: backhaul sockets, first-writer-wins registration,
# durable webhook buffer, ephemeral OAuth handoff map. One global instance.
[[durable_objects.bindings]]
name = "RELAY_REGISTRY"
class_name = "RelayRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRegistry"]

# Reporting has private, independent storage; it never uses RelayRegistry.
[[d1_databases]]
binding = "REPORT_DB"
database_name = "natlang-problem-reports"
database_id = "d9b68f52-c075-4a51-93a9-314f0a552a8a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPORT_BUNDLES"
bucket_name = "vibestudio-problem-report-bundles"

[triggers]
crons = ["17 * * * *"]

[[ratelimits]]
name = "REPORT_SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REPORT_READ_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "REPORT_MUTATION_LIMIT"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "REPORT_RECEIPT_LIMIT"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REPORT_AUTH_FAILURE_LIMIT"
namespace_id = "1006"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "REPORT_USAGE_LIMIT"
namespace_id = "1007"
simple = { limit = 120, period = 60 }
