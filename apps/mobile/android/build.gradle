// Vibestudio Android root build file

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.21"
        // VisionCamera 4.7.3 declares an early CameraX 1.5 alpha. Keep the
        // application authoritative for the runtime family: CameraX 1.5.2+
        // is required to ignore future Android dynamic-range profiles instead
        // of crashing while React Native initializes native modules.
        cameraXVersion = "1.5.3"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        // computer.iroh carries a repaired native binding that upstream has not
        // released: its stream mutex is held across network waits, so a pending
        // read cannot be cancelled. Installed by
        // `pnpm iroh:install-android` on every machine that builds this app.
        mavenLocal()
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
    }

    // Native libraries may declare an older CameraX family internally, but
    // the application owns the one version compiled and packaged everywhere.
    // Keeping every configuration coherent also prevents a library compile
    // graph from silently diverging from the runtime graph.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "androidx.camera") {
                details.useVersion(rootProject.ext.cameraXVersion)
                details.because("CameraX 1.5.2+ safely ignores future Android dynamic-range profiles")
            }
        }
    }
}
