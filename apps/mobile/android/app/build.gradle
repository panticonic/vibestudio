import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def vibestudioVersion = new JsonSlurper()
    .parse(rootProject.file("../../../package.json"))
    .version

def hermesOsBin = {
    def os = org.gradle.internal.os.OperatingSystem.current()
    if (os.isLinux()) return "linux64-bin"
    if (os.isMacOsX()) return "osx-bin"
    if (os.isWindows()) return "win64-bin"
    throw new GradleException("Unsupported OS for React Native Hermes compiler")
}()
def hermesExecutable = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "hermesc.exe" : "hermesc"
def defaultHermesCommand = rootProject.file("../../../node_modules/react-native/sdks/hermesc/${hermesOsBin}/${hermesExecutable}").absolutePath
def configuredHermesCommand = providers
    .gradleProperty("vibestudioHermesCommand")
    .orElse(providers.environmentVariable("VIBESTUDIO_HERMESC"))
    .orNull

// Apply google-services only when the JSON exists locally. Devs without
// Firebase can copy google-services.template.json to google-services.json.
def hasFirebaseConfig = file("google-services.json").exists()
if (hasFirebaseConfig) {
    apply plugin: "com.google.gms.google-services"
}

/**
 * React Native Gradle Plugin configuration.
 * https://github.com/facebook/react-native/tree/main/packages/react-native-gradle-plugin
 */
react {
    // This app lives in a hoisted monorepo, so React Native and Codegen come
    // from the workspace root instead of apps/mobile/node_modules.
    reactNativeDir = rootProject.file("../../../node_modules/react-native")
    codegenDir = rootProject.file("../../../node_modules/@react-native/codegen")
    cliFile = rootProject.file("../../../node_modules/react-native/cli.js")
    hermesCommand = configuredHermesCommand ?: defaultHermesCommand
    // Source installs are often launched beside Electron, the workspace
    // server, and workerd. Bound Metro's worker pool just like the runtime RN
    // provider so a cold APK build cannot fan out across every CPU and exhaust
    // the desktop. The override is shared with that provider.
    extraPackagerArgs = [
        "--max-workers",
        System.getenv("VIBESTUDIO_RN_BUNDLE_WORKERS") ?: "2",
    ]

    // Autolinking configuration
    autolinkLibrariesWithApp()
}

// React Native's bundle task tracks `react.root` (apps/mobile) by default, but
// Metro deliberately resolves @vibestudio/* to this monorepo's package source
// and loads the workspace-owned mobile app from outside that root. Without
// declaring those same source roots to Gradle, `assembleInternal` can reinstall
// a stale JS bundle after a shared transport or mobile-workspace edit. Extend
// the canonical RN task's inputs; do not force unrelated native tasks to rerun.
def vibestudioMetroSourceTrees = [
    rootProject.file("../../../packages"),
    rootProject.file("../../../workspace/apps/mobile"),
].collect { sourceRoot ->
    fileTree(sourceRoot) {
        include "**/*.js", "**/*.jsx", "**/*.ts", "**/*.tsx", "**/*.json"
        exclude "**/build/**", "**/dist/**", "**/node_modules/**"
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")) {
        task.inputs.files(vibestudioMetroSourceTrees)
            .withPropertyName("vibestudioMetroSources")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

android {
    namespace "app.vibestudio.mobile"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.vibestudio.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        // The desktop compares the installed app version with the product
        // version before deciding whether installation is necessary. Keep one
        // source of truth so a source build is immediately recognized as the
        // compatible artifact it just installed.
        versionName vibestudioVersion
        buildConfigField "boolean", "VIBESTUDIO_HAS_FIREBASE", hasFirebaseConfig ? "true" : "false"
    }

    signingConfigs {
        if (project.hasProperty('RELEASE_STORE_FILE')) {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            buildConfigField "boolean", "REACT_NATIVE_DEV_SUPPORT", "true"
        }
        internal {
            initWith debug
            matchingFallbacks = ["debug"]
            applicationIdSuffix ".internal"
            versionNameSuffix "-internal"
            signingConfig signingConfigs.debug
            debuggable true
            buildConfigField "boolean", "REACT_NATIVE_DEV_SUPPORT", "false"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig project.hasProperty('RELEASE_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            buildConfigField "boolean", "REACT_NATIVE_DEV_SUPPORT", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // React Native framework
    implementation("com.facebook.react:react-android")

    // Hermes JS engine
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
