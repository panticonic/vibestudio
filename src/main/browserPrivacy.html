<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Browser privacy</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: Canvas;
        --text: CanvasText;
        --muted: GrayText;
        --border: color-mix(in srgb, CanvasText 18%, transparent);
        --surface: color-mix(in srgb, CanvasText 5%, Canvas);
        --danger: #c33;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      nav {
        display: flex;
        gap: 0.35rem;
        padding: 0.75rem;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }
      button,
      input,
      select {
        font: inherit;
        padding: 0.55rem 0.7rem;
        border: 1px solid var(--border);
        border-radius: 0.4rem;
        background: var(--surface);
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
      button.danger {
        color: var(--danger);
      }
      main {
        padding: 1rem 1.25rem;
        max-width: 64rem;
        margin: auto;
      }
      .toolbar,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      .row {
        padding: 0.7rem 0;
        border-bottom: 1px solid var(--border);
      }
      .muted {
        color: var(--muted);
      }
      .error {
        color: var(--danger);
      }
      pre {
        white-space: pre-wrap;
      }
      #status {
        min-height: 1.4rem;
        margin: 0.5rem 0;
      }
      dialog {
        max-width: 30rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        background: var(--bg);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <nav aria-label="Browser privacy sections">
      <button data-section="credentials">Credentials</button
      ><button data-section="formFill">Form fill</button
      ><button data-section="inspect">Inspect</button><button data-section="debug">Debug</button
      ><button data-section="export">Export</button>
    </nav>
    <main>
      <div id="status" role="status" aria-live="polite"></div>
      <section id="content" aria-busy="true">
        <p class="muted">Loading protected browser data…</p>
      </section>
    </main>
    <dialog id="confirm">
      <form method="dialog">
        <h2>Confirm action</h2>
        <p id="confirm-message"></p>
        <div class="toolbar">
          <button value="cancel">Cancel</button
          ><button class="danger" value="confirm">Continue</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
