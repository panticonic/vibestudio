name: Prepare the pinned celld runtime
description: Verify and stage the fork artifact for a declared application target
inputs:
  target:
    description: The application platform and architecture
    required: true
runs:
  using: composite
  steps:
    - name: Stage the fork runtime
      shell: bash
      env:
        CELLD_TARGET: ${{ inputs.target }}
        GH_TOKEN: ${{ github.token }}
      run: node scripts/stage-ci-celld.mjs "$CELLD_TARGET"
