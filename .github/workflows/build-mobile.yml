name: Build Mobile Shell

on:
  push:
    branches: [main]
    tags: ["mobile-v*"]
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/rpc/**"
      - "packages/shared/**"
  workflow_dispatch:

permissions: {}

jobs:
  build-android:
    name: Build Android APK/AAB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-mobile-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-mobile-

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize pinned Base release
        env:
          BASE_RELEASE_DIR: ${{ runner.temp }}/vibestudio-base-release
        run: |
          node scripts/checkout-base-template-release.mjs "$BASE_RELEASE_DIR"
          echo "VIBESTUDIO_USERLAND_ROOT=$BASE_RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Link node_modules for Gradle
        run: |
          # Gradle resolves node_modules from apps/mobile/android/ via
          # settings.gradle path: ../node_modules = apps/mobile/node_modules/
          # pnpm hoisted may not put all deps there, so symlink to root.
          if [ ! -L apps/mobile/node_modules ]; then
            rm -rf apps/mobile/node_modules
            ln -s ../../node_modules apps/mobile/node_modules
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Set up release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IS_MOBILE_TAG: ${{ startsWith(github.ref, 'refs/tags/mobile-v') }}
        run: |
          # We deliberately only write the keystore file and the
          # NON-SECRET RELEASE_STORE_FILE / RELEASE_KEY_ALIAS pointers to
          # gradle.properties. The two passwords are passed to Gradle via
          # ORG_GRADLE_PROJECT_* env vars on the build step itself, so
          # they never hit disk and cannot be read by a subsequent
          # compromised step (e.g. a tag-moved upload action) that
          # inherits the workspace.
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$IS_MOBILE_TAG" = "true" ]; then
              echo "mobile-v* tag builds require ANDROID_KEYSTORE_BASE64 and release signing secrets" >&2
              exit 1
            fi
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured, PR build will use debug signing"
          else
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 -d > apps/mobile/android/app/release.keystore
            echo "RELEASE_STORE_FILE=release.keystore" >> apps/mobile/android/gradle.properties
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" >> apps/mobile/android/gradle.properties
          fi

      - name: Build release APK and AAB
        # Passwords are injected via ORG_GRADLE_PROJECT_* so Gradle picks
        # them up as project properties (`RELEASE_STORE_PASSWORD`,
        # `RELEASE_KEY_PASSWORD`) without touching gradle.properties.
        # NOTE: apps/mobile/android/app/build.gradle currently reads
        # `RELEASE_STORE_PASSWORD` / `RELEASE_KEY_PASSWORD` via
        # `project.hasProperty(...)`. ORG_GRADLE_PROJECT_<name> env vars
        # surface as project properties in Gradle, so the existing build
        # script keeps working unchanged. If the script is ever refactored
        # to read from `gradle.properties` directly via
        # `Properties().load(file(...))`, this env-passing approach will
        # break — keep the two paths in sync.
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Remove release signing material
        if: ${{ always() && steps.signing.outputs.has_keystore == 'true' }}
        run: |
          rm -f apps/mobile/android/app/release.keystore
          sed -i '/^RELEASE_STORE_FILE=/d; /^RELEASE_KEY_ALIAS=/d' apps/mobile/android/gradle.properties

      - name: Generate checksums
        run: |
          cd apps/mobile/android/app/build/outputs
          mkdir -p release-artifacts
          find . -type f \( -name "*.apk" -o -name "*.aab" \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > release-artifacts/SHA256SUMS-android
          test -s release-artifacts/SHA256SUMS-android

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-mobile-${{ github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
            apps/mobile/android/app/build/outputs/release-artifacts/SHA256SUMS-android
          if-no-files-found: error
          retention-days: 30

  publish-android:
    name: Verify and publish Android release
    needs: build-android
    if: ${{ startsWith(github.ref, 'refs/tags/mobile-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable Android release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-mobile-${{ github.sha }}
          path: release-candidate

      - name: Verify Android release checksums
        working-directory: release-candidate
        run: sha256sum --check release-artifacts/SHA256SUMS-android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-candidate/apk/release/*.apk
            release-candidate/bundle/release/*.aab
            release-candidate/release-artifacts/SHA256SUMS-android
          generate_release_notes: true

  build-ios:
    name: Build iOS shell
    runs-on: macos-15
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Generate entitlements
        run: node scripts/cli/ios-entitlements.mjs --configuration Debug --output apps/mobile/ios/Generated/Vibestudio.entitlements

      - name: Build iOS Debug simulator shell
        working-directory: apps/mobile/ios
        run: |
          xcodebuild \
            -workspace Vibestudio.xcworkspace \
            -scheme Vibestudio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=Generated/Vibestudio.entitlements \
            build
