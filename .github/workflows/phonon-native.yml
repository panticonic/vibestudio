name: Offline Phonon inference
on:
  pull_request:
    paths:
      [
        "native/phonon/**",
        "scripts/phonon-*.mjs",
        "pnpm-lock.yaml",
        "src/server/services/speech*.ts",
        "packages/service-schemas/src/speech.ts",
        ".github/workflows/phonon-native.yml",
      ]
  workflow_dispatch:
permissions: {}
jobs:
  inference:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test native/phonon/phonon.test.mjs
      - run: node scripts/phonon-smoke.mjs
