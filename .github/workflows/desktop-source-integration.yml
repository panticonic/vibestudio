name: Verify development desktop source integration

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions: {}

jobs:
  smoke:
    name: Development desktop source integration on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact source integration inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-darwin-source-inputs-${{ github.sha }}
          path: .cache/source-inputs

      - name: Restore and verify exact source integration inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf .cache/source-inputs/darwin-source-inputs.tar
          node scripts/ci-host-build-inputs.mjs verify --source-sha "$SOURCE_SHA" --desktop-mode production --source-mode development --template-root "$GITHUB_WORKSPACE/.cache/template-checkouts"
          test -f .cache/ci-workspace-release/userland-builds/release.json
          printf 'NODE_ENV=development\nVIBESTUDIO_WORKSPACE_RELEASE_ROOT=%s\nVIBESTUDIO_TEMPLATE_CHECKOUTS=%s\n' "$GITHUB_WORKSPACE/.cache/ci-workspace-release" "$GITHUB_WORKSPACE/.cache/template-checkouts" >> "$GITHUB_ENV"

      - name: Desktop pairing, approvals, panels, relaunch, and recovery
        id: desktop-smoke
        shell: bash
        run: |
          mkdir -p test-results/desktop-pairing-smoke
          sudo tcpdump -i lo0 -n -l -tttt 'tcp[tcpflags] & (tcp-syn|tcp-fin|tcp-rst) != 0' > test-results/desktop-pairing-smoke/transport-diagnostics.log 2>&1 &
          capture_pid=$!
          trap 'sudo kill -TERM "$capture_pid"; wait "$capture_pid" || true' EXIT
          node scripts/desktop-pairing-smoke.mjs --template-checkouts "$GITHUB_WORKSPACE/.cache/template-checkouts"

      - name: Retain desktop HTTP connection evidence
        if: ${{ !cancelled() && (steps.desktop-smoke.outcome == 'success' || steps.desktop-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-source-http-connections-${{ inputs.runner }}
          path: test-results/desktop-pairing-smoke/transport-diagnostics.log
          if-no-files-found: error
          retention-days: 3

      - name: Retain desktop onboarding failure evidence
        if: ${{ !cancelled() && steps.desktop-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-source-onboarding-diagnostics-${{ inputs.runner }}
          path: |
            test-results/desktop-pairing-smoke/*diagnostics-*.json
            test-results/desktop-pairing-smoke/desktop-*.png
          if-no-files-found: warn
          retention-days: 3
