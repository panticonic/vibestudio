name: Build and verify Darwin production host inputs

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions: {}

jobs:
  production-host:
    name: Build and verify Darwin production host on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared Darwin native release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-darwin-arm64
          path: native/isolation/artifacts/native-isolation-darwin-arm64

      - name: Download source-attested Darwin process observers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer

      - name: Prepare and exercise native dependencies
        run: pnpm check:native-host-dependencies --repair

      - name: Build production application and headless host
        run: pnpm build

      - name: Use prepared Darwin native release input
        env:
          NATIVE_TARGET: darwin-arm64
        run: |
          node --input-type=module <<'NODE'
          import { assertNativeIsolationArtifacts, nativeIsolationTarget } from "./scripts/native-isolation-artifacts.mjs";
          const [platform, arch] = process.env.NATIVE_TARGET.split("-");
          assertNativeIsolationArtifacts(process.cwd(), undefined, [nativeIsolationTarget(platform, arch)]);
          NODE
          cp native/isolation/artifacts/native-isolation-darwin-arm64/* dist/mxc/darwin-arm64/
          chmod 0755 dist/mxc/darwin-arm64/mxc-exec-mac

      - name: Check native execution and platform permissions
        id: native-check
        run: pnpm vitest run --config packages/process-adapter/vitest.native.config.ts --reporter=default --reporter=json --outputFile=.cache/native-acceptance.json

      - name: Upload native acceptance report
        if: ${{ !cancelled() && (steps.native-check.outcome == 'success' || steps.native-check.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-darwin-arm64-${{ inputs.runner }}
          path: .cache/native-acceptance.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose macOS sandbox denials
        if: ${{ failure() && steps.native-check.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100

      - name: Verify and archive production host inputs
        id: host-inputs
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/ci-host-build-inputs.mjs write --source-sha "$SOURCE_SHA" --desktop-mode production
          shopt -s nullglob
          package_dists=(packages/*/dist)
          test "${#package_dists[@]}" -gt 0
          tar -cf darwin-host-inputs.tar --exclude=dist/host-generations/.leases --exclude=dist/host-generations/.lock --exclude='dist/host-generations/.garbage-*' --exclude='dist/host-generations/.staging-*' .cache/darwin-host-inputs.json .cache/vibestudio-infrastructure-build.json dist "${package_dists[@]}"

      - name: Upload production host inputs
        if: ${{ !cancelled() && steps.host-inputs.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-darwin-host-production-${{ github.sha }}
          path: darwin-host-inputs.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
