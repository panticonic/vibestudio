name: Iroh remote e2e (nightly)

# Real Iroh coverage from transport primitives through the complete Electron
# and Android user experience, including first-run approvals, panel startup,
# new-panel creation, app relaunch, and server-restart recovery.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  iroh-remote-e2e:
    name: Iroh remote (native + relay + operational)
    runs-on: ubuntu-latest
    env:
      VIBESTUDIO_USERLAND_ROOT: ${{ github.workspace }}/vibestudio-workspace-base
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout current Base userland
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: panticonic/vibestudio-workspace-base
          path: vibestudio-workspace-base
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop smoke runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Iroh remote transport and lifecycle suites
        run: pnpm test:remote-transport

      - name: Pinned Iroh relay fixture
        run: pnpm test:iroh-relay-fixture

      - name: Desktop Iroh pairing, approvals, and panel lifecycle
        run: pnpm test:iroh-desktop-e2e

  android-iroh-smoke:
    name: Android Iroh UX and recovery
    runs-on: ubuntu-latest
    env:
      VIBESTUDIO_USERLAND_ROOT: ${{ github.workspace }}/vibestudio-workspace-base
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout current Base userland
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: panticonic/vibestudio-workspace-base
          path: vibestudio-workspace-base
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server artifacts
        run: pnpm build

      - name: Android Iroh pairing, approvals, panel lifecycle, and recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: node scripts/cli/mobile-smoke.mjs --platform android
