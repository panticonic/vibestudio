name: Iroh remote e2e (nightly)

# Real Iroh coverage from transport primitives through the complete Electron
# and Android user experience, including first-run approvals, panel startup,
# new-panel creation, app relaunch, and server-restart recovery.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  iroh-remote-e2e:
    name: Iroh remote (native + relay + operational)
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Set up Linux desktop source runtime
        uses: ./.github/actions/setup-linux-source-runtime
        with:
          desktop: "true"

      - name: Iroh remote transport and lifecycle suites
        run: pnpm test:remote-transport

      - name: Pinned Iroh relay fixture
        run: pnpm test:iroh-relay-fixture

      - name: Desktop Iroh pairing, approvals, and panel lifecycle
        run: pnpm test:iroh-desktop-e2e

  android-iroh-smoke:
    name: Android Iroh UX and recovery
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Set up Linux mobile source runtime
        uses: ./.github/actions/setup-linux-source-runtime

      - name: Grant the runner its KVM device access
        shell: bash
        run: |
          set -euo pipefail
          kvm_device=/dev/kvm
          if [[ ! -c "$kvm_device" ]]; then
            echo "Android x86_64 emulator requires the runner's KVM device" >&2
            exit 1
          fi
          if ! command -v setfacl >/dev/null 2>&1; then
            echo "The runner image must provide setfacl to grant scoped KVM access" >&2
            exit 1
          fi

          sudo setfacl -m "u:$(id -u):rw" "$kvm_device"
          if [[ ! -r "$kvm_device" || ! -w "$kvm_device" ]]; then
            echo "The runner still cannot read and write $kvm_device" >&2
            exit 1
          fi

      - name: Android Iroh pairing, approvals, panel lifecycle, and recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            set -euo pipefail
            "$ANDROID_HOME/emulator/emulator" -accel-check
          script: pnpm test:iroh-mobile-e2e
