name: macOS release candidate acceptance

on:
  workflow_call:

jobs:
  accept-macos-release-candidate:
    name: Install and launch the exact macOS release candidate
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The harness scripts own their processes through packages/shared, which
      # reads profile paths from the compiled env-paths package.
      - name: Build the infrastructure packages the harness imports
        run: pnpm build:infrastructure
      # The harness's process ownership finds its native observer under dist/.
      - name: Download source-attested Darwin process observers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer
          if-no-artifact-found: error
      # Artifact transfer drops the executable mode; this authenticates the binary
      # against its source receipt before restoring it.
      - name: Authenticate and restore the Darwin process observers
        run: pnpm prepare:darwin-process-observers
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: candidate
      - name: Verify, install, and launch the DMG
        shell: bash
        run: |
          (cd candidate && shasum -a 256 --check SHA256SUMS-macos)
          images=(candidate/*.dmg)
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/vibestudio-dmg"
          mkdir -p "$mount" installed
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Vibestudio.app" installed/Vibestudio.app
          codesign --verify --deep --strict --verbose=2 installed/Vibestudio.app
          signing_mode="$(cat candidate/macos-signing.txt)"
          case "$signing_mode" in
            developer-id)
              xcrun stapler validate installed/Vibestudio.app
              spctl --assess --type execute --verbose=2 installed/Vibestudio.app
              ;;
            ad-hoc)
              echo "Acceptance matches the deliberately ad-hoc signed release candidate."
              ;;
            *)
              echo "Unknown macOS signing mode: $signing_mode" >&2
              exit 1
              ;;
          esac
          node scripts/packaged-isolation-smoke.mjs --app installed/Vibestudio.app --out-dir test-results/packaged-isolation
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-macos
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
