name: CI diagnostic
run-name: "CI diagnostic: ${{ inputs.target }}"

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact expensive CI job to rerun with its prerequisites
        type: choice
        options:
          - npm-server-preflight
          - linux-installer-x64
          - linux-installer-arm64
          - windows-installer-candidate
          - quality-desktop
          - quality-linux
          - android-iroh-smoke
          - application-candidate-mac
        required: true
      base-ref:
        description: Base template branch or commit used by the npm preflight
        type: string
        default: main
        required: true
      windows-runner:
        description: Configured Windows runner label
        type: string
        default: windows-2025
        required: true
      release-tag:
        description: Exact vX.Y.Z package version tag; required for application-candidate-mac
        type: string
        default: ""
        required: false

permissions: {}

jobs:
  quality-inputs:
    name: Prepare exact Linux quality inputs
    if: ${{ inputs.target == 'npm-server-preflight' || inputs.target == 'quality-desktop' || inputs.target == 'quality-linux' }}
    uses: ./.github/workflows/quality-inputs.yml
    with:
      base-ref: ${{ inputs.base-ref }}
    permissions:
      contents: read

  native-input-linux-x64:
    name: Prepare native release input (linux-x64)
    if: ${{ inputs.target == 'npm-server-preflight' || inputs.target == 'linux-installer-x64' || inputs.target == 'linux-installer-arm64' || inputs.target == 'windows-installer-candidate' || inputs.target == 'application-candidate-mac' }}
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04
      target: linux-x64
    permissions:
      contents: read

  native-input-linux-arm64:
    name: Prepare native release input (linux-arm64)
    if: ${{ inputs.target == 'npm-server-preflight' || inputs.target == 'linux-installer-arm64' }}
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04-arm
      target: linux-arm64
    permissions:
      contents: read

  native-input-darwin-arm64:
    name: Prepare native release input (darwin-arm64)
    if: ${{ inputs.target == 'npm-server-preflight' || inputs.target == 'application-candidate-mac' }}
    uses: ./.github/workflows/native-input.yml
    with:
      runner: macos-14
      target: darwin-arm64
    permissions:
      contents: read

  workspace-release:
    name: Build the workspace release once
    if: ${{ inputs.target == 'linux-installer-x64' || inputs.target == 'linux-installer-arm64' || inputs.target == 'windows-installer-candidate' || inputs.target == 'application-candidate-mac' }}
    needs: native-input-linux-x64
    uses: ./.github/workflows/workspace-release.yml
    permissions:
      contents: read

  npm-server-preflight:
    name: Staged headless server npm candidate
    if: ${{ inputs.target == 'npm-server-preflight' }}
    needs:
      - quality-inputs
      - native-input-linux-x64
      - native-input-linux-arm64
      - native-input-darwin-arm64
    uses: ./.github/workflows/npm-server-preflight.yml
    permissions:
      contents: read

  quality-desktop:
    name: Desktop Iroh source integration
    if: ${{ inputs.target == 'quality-desktop' }}
    needs: quality-inputs
    uses: ./.github/workflows/quality-desktop.yml
    permissions:
      contents: read

  quality-linux:
    name: Remaining Linux quality checks
    if: ${{ inputs.target == 'quality-linux' }}
    needs: quality-inputs
    uses: ./.github/workflows/quality-linux.yml
    permissions:
      contents: read

  android-iroh-smoke:
    name: Android Iroh UX and recovery
    if: ${{ inputs.target == 'android-iroh-smoke' }}
    uses: ./.github/workflows/android-iroh-smoke.yml
    permissions:
      contents: read

  darwin-production-host:
    name: Build and verify exact Darwin production host inputs
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: native-input-darwin-arm64
    uses: ./.github/workflows/darwin-production-host.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  application-candidate-mac:
    name: Package macOS application candidate from tested host inputs
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: [darwin-production-host, workspace-release]
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: macos-14
      target: darwin-arm64
      package: mac
      release-candidate: true
      release-tag: ${{ inputs.release-tag }}
    # Match CI's repository-variable gate for Apple signing credentials.
    secrets:
      APPLE_CSC_LINK: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_MAC == 'true' && secrets.APPLE_CSC_LINK || '' }}
      APPLE_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_MAC == 'true' && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_MAC == 'true' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_MAC == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_MAC == 'true' && secrets.APPLE_TEAM_ID || '' }}
    permissions:
      contents: read

  packaged-acceptance-macos-14:
    name: Installed application (darwin-arm64, macos-14)
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: application-candidate-mac
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-14
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  packaged-acceptance-macos-26:
    name: Installed application (darwin-arm64, macos-26)
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: application-candidate-mac
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-26
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  macos-release-candidate:
    name: Package macOS release installers from the accepted app candidate
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: application-candidate-mac
    uses: ./.github/workflows/macos-release-candidate.yml
    with:
      release-tag: ${{ inputs.release-tag }}
    permissions:
      contents: read

  accept-macos-release-candidate:
    name: Install and launch the exact macOS release candidate
    if: ${{ inputs.target == 'application-candidate-mac' }}
    needs: macos-release-candidate
    uses: ./.github/workflows/accept-macos-release-candidate.yml
    permissions:
      contents: read

  linux-installer-x64:
    name: Build Linux x64 installer candidate
    if: ${{ inputs.target == 'linux-installer-x64' }}
    needs: [native-input-linux-x64, workspace-release]
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04
      arch: x64
    permissions:
      contents: read

  linux-installer-arm64:
    name: Build Linux arm64 installer candidate
    if: ${{ inputs.target == 'linux-installer-arm64' }}
    needs: [native-input-linux-arm64, workspace-release]
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
    permissions:
      contents: read

  application-candidate-windows:
    name: Package Windows application candidate and verify native execution
    if: ${{ inputs.target == 'windows-installer-candidate' }}
    needs: workspace-release
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: ${{ inputs.windows-runner }}
      target: win32-x64
      package: windows
      release-candidate: false
    permissions:
      contents: read

  windows-installer-candidate:
    name: Package NSIS installer from the tested Windows application
    if: ${{ inputs.target == 'windows-installer-candidate' }}
    needs: application-candidate-windows
    uses: ./.github/workflows/windows-installer.yml
    with:
      runner: ${{ inputs.windows-runner }}
    permissions:
      contents: read
