name: Desktop Iroh source integration

on:
  workflow_call:

permissions: {}

jobs:
  integration:
    name: Desktop Iroh source integration
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Linux desktop source runtime
        uses: ./.github/actions/setup-linux-source-runtime
        with:
          desktop: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact quality inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-quality-inputs-${{ github.sha }}

      - name: Restore and verify quality inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf quality-inputs.tar
          node scripts/ci-quality-inputs.mjs verify "$SOURCE_SHA" "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Install browser and desktop integration runtimes
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring
          command -v gnome-keyring-daemon

      - name: Native Iroh remote transport
        run: pnpm test:remote-transport

      - name: Desktop Iroh pairing, approvals, panels, relaunch, and recovery
        run: pnpm test:iroh-desktop-e2e

