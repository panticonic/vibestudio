name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release-preparation:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ""
      base-ref:
        type: string
        default: main
      windows-runner:
        type: string
        default: windows-2025
    secrets:
      LINUX_SIGNING_KEY:
        required: false
      APPLE_CSC_LINK:
        required: false
      APPLE_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  workflow_dispatch:
    inputs:
      base-ref:
        description: Exact Base template commit or branch paired with this host revision
        type: string
        default: main
        required: true
      windows-runner:
        description: Windows runner label (use a configured Windows 11 desktop runner for desktop acceptance)
        type: string
        default: windows-2025
        required: true

permissions: {}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout current Base template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panticonic/vibestudio-base
          ref: ${{ inputs.base-ref || 'main' }}
          path: vibestudio-templates/base
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Linux source runtime
        uses: ./.github/actions/setup-linux-source-runtime
        with:
          desktop: "true"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Check declared template runtime dependencies
        run: pnpm check:userland-dependencies

      - name: Check GitHub Actions workflows
        run: pnpm check:workflows

      - name: Check acceptance and native preparation harnesses
        run: node --test scripts/source-server-prerequisites.test.mjs scripts/host-build-generations.test.mjs scripts/host-build-fingerprint.test.mjs scripts/lib/npm-runtime-script-closure.test.mjs scripts/packaged-isolation-smoke.test.mjs scripts/native-host-dependencies.test.mjs scripts/node-runtime-artifacts.test.mjs scripts/macos-test-keychain.test.mjs scripts/branded-electron.test.mjs apps/mobile/metro.config.test.cjs

      - name: Type-check
        run: pnpm type-check

      - name: Template type-check and complete userland suite
        run: pnpm test:pair

      - name: Mobile host and Iroh integration suites
        run: pnpm test:mobile

      - name: Host/workspace boundary
        run: pnpm check:host-boundary

      - name: Production host builds without userland source
        run: pnpm test:host-build-without-workspace

      - name: Production Electron Node-mode native workspace receiver
        run: ELECTRON_RUN_AS_NODE=1 pnpm exec electron node_modules/vitest/vitest.mjs run src/server/nativeWorkspaceRuntime.integration.test.ts

      - name: Native Iroh remote transport
        run: pnpm test:remote-transport

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install browser and desktop integration runtimes
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring
          command -v gnome-keyring-daemon

      - name: Desktop Iroh pairing, approvals, panels, relaunch, and recovery
        run: pnpm test:iroh-desktop-e2e

      - name: Unit tests
        run: pnpm test

  mac-portability:
    name: macOS portability
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure packages
        run: pnpm build:infrastructure

      - name: Prepare the current desktop host generation
        run: NODE_ENV=development node scripts/ensure-host-build.mjs

      - name: Exercise macOS-sensitive host paths
        run: >-
          pnpm vitest run
          src/server/historicalHostSnapshot.test.ts
          src/server/historicalWorkspaceHost.test.ts
          src/server/hubServer.test.ts
          packages/extension-host/src/atomicStorage.test.ts
          src/server/storage/blobCas.test.ts

      - name: Exercise macOS release checksum tooling
        run: |
          checksum_dir="$RUNNER_TEMP/vibestudio-checksum-smoke"
          mkdir -p "$checksum_dir"
          touch "$checksum_dir/Vibestudio test.dmg"
          cd "$checksum_dir"
          shasum -a 256 ./*.dmg > SHA256SUMS-macos
          test "$(wc -l < SHA256SUMS-macos)" -eq 1

  native-input-linux-x64:
    name: Prepare native release input (linux-x64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04
      target: linux-x64
    permissions:
      contents: read

  native-input-linux-arm64:
    name: Prepare native release input (linux-arm64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04-arm
      target: linux-arm64
    permissions:
      contents: read

  native-input-darwin-arm64:
    name: Prepare native release input (darwin-arm64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: macos-14
      target: darwin-arm64
    permissions:
      contents: read

  linux-installer-x64:
    name: Build Linux x64 installer candidate
    # Release candidates need only their matching native input. These jobs run
    # inside release-quality for an explicit pre-tag release preparation.
    needs: native-input-linux-x64
    if: ${{ vars.RELEASE_LINUX == 'true' && inputs.release-preparation }}
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04
      arch: x64
      release-tag: ${{ inputs.release-tag }}
    permissions:
      contents: read

  linux-installer-arm64:
    name: Build Linux arm64 installer candidate
    needs: native-input-linux-arm64
    if: ${{ vars.RELEASE_LINUX == 'true' && inputs.release-preparation }}
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      release-tag: ${{ inputs.release-tag }}
    permissions:
      contents: read

  native-isolation-linux-x64:
    name: Verify native workspace execution (linux-x64)
    needs: native-input-linux-x64
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: ubuntu-22.04
      target: linux-x64
    permissions:
      contents: read

  native-isolation-linux-arm64:
    name: Verify native workspace execution (linux-arm64)
    needs: native-input-linux-arm64
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: ubuntu-22.04-arm
      target: linux-arm64
    permissions:
      contents: read

  native-isolation-darwin-arm64:
    name: Verify native workspace execution (darwin-arm64)
    needs:
      - native-input-darwin-arm64
      - darwin-development-inputs
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: macos-26
      target: darwin-arm64
    permissions:
      contents: read

  darwin-production-host:
    name: Build and verify exact Darwin production host inputs
    needs: native-input-darwin-arm64
    uses: ./.github/workflows/darwin-production-host.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  application-candidate-mac:
    name: Package macOS application candidate from tested host inputs
    needs: darwin-production-host
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: macos-14
      target: darwin-arm64
      package: mac
      release-candidate: ${{ inputs.release-preparation }}
      release-tag: ${{ inputs.release-tag }}
    secrets:
      APPLE_CSC_LINK: ${{ inputs.release-preparation && secrets.APPLE_CSC_LINK || '' }}
      APPLE_CSC_KEY_PASSWORD: ${{ inputs.release-preparation && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ inputs.release-preparation && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release-preparation && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.release-preparation && secrets.APPLE_TEAM_ID || '' }}
    permissions:
      contents: read

  darwin-development-inputs:
    name: Prepare exact Darwin development host and workspace release
    needs: darwin-production-host
    uses: ./.github/workflows/darwin-host-inputs.yml
    with:
      runner: macos-14
      base-ref: ${{ inputs.base-ref || 'main' }}
    permissions:
      contents: read

  desktop-source-integration-macos-14:
    name: Development desktop source integration (macos-14)
    needs: darwin-development-inputs
    uses: ./.github/workflows/desktop-source-integration.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  application-candidate-windows:
    name: Package Windows application candidate and verify native execution
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      target: win32-x64
      package: windows
    permissions:
      contents: read

  windows-installer-candidate:
    name: Package NSIS installer from the tested Windows application
    needs: application-candidate-windows
    if: ${{ vars.RELEASE_WINDOWS == 'true' && inputs.release-preparation }}
    uses: ./.github/workflows/windows-installer.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      release-tag: ${{ inputs.release-tag }}
    permissions:
      contents: read

  npm-server-preflight:
    name: Staged headless server npm candidate
    # The universal candidate consumes all three prepared inputs, not native test results.
    needs:
      - native-input-linux-x64
      - native-input-linux-arm64
      - native-input-darwin-arm64
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Prepare private npm candidate scratch
        run: |
          owned_tmpdir="$RUNNER_TEMP/vibestudio-npm-server-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 0700 -p "$owned_tmpdir"
          printf 'TMPDIR=%s\n' "$owned_tmpdir" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux npm-candidate sandbox runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap

      - name: Allow installed npm candidate MXC user namespace under AppArmor
        run: |
          profile="$RUNNER_TEMP/vibestudio-server-npm-mxc.apparmor"
          source_executable="$GITHUB_WORKSPACE/dist/mxc/linux-x64/lxc-exec"
          staged_executable="$GITHUB_WORKSPACE/dist-packages/server/dist/mxc/linux-x64/lxc-exec"
          executable="$TMPDIR/vibestudio-npm-server-check-*/install/lib/node_modules/@panticonic/vibestudio-server/dist/mxc/linux-x64/lxc-exec"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile vibestudio_server_npm_mxc_source "$source_executable" flags=(unconfined) {
            userns,
          }

          profile vibestudio_server_npm_mxc_staged "$staged_executable" flags=(unconfined) {
            userns,
          }

          profile vibestudio_server_npm_mxc_installed "$executable" flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -m 0644 "$profile" /etc/apparmor.d/vibestudio-server-npm-mxc
          sudo apparmor_parser -r /etc/apparmor.d/vibestudio-server-npm-mxc

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Check declared template runtime dependencies
        run: pnpm check:userland-dependencies

      - name: Download prepared Linux x64 native isolation input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-linux-x64-${{ github.sha }}
          path: native/isolation/artifacts/native-isolation-linux-x64

      - name: Download prepared Linux arm64 native isolation input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-linux-arm64-${{ github.sha }}
          path: native/isolation/artifacts/native-isolation-linux-arm64

      - name: Download prepared Darwin arm64 native isolation input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-darwin-arm64-${{ github.sha }}
          path: native/isolation/artifacts/native-isolation-darwin-arm64

      - name: Download source-attested Darwin observers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer

      - name: Build npm preflight helpers and their RPC dependencies
        run: pnpm build:infrastructure

      - name: Test npm package and publication helpers
        run: node --test scripts/build-server-npm-package.test.mjs scripts/build-artifact-contracts.test.mjs scripts/publish-npm.test.mjs

      - name: Generate pinned template release metadata
        run: pnpm generate:workspace-template-release

      - name: Build, stage, verify, and retain the npm candidate
        run: >-
          pnpm publish:server-npm -- --dry-run-only
          --candidate-output "$TMPDIR/npm-candidate"

      - name: Upload verified npm candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-server-npm-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ env.TMPDIR }}/npm-candidate/*.tgz
            ${{ env.TMPDIR }}/npm-candidate/candidate-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Retire npm candidate smoke scratch
        if: ${{ always() }}
        run: rm -rf -- "$RUNNER_TEMP/vibestudio-npm-server-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  packaged-acceptance-macos-14:
    name: Installed application (darwin-arm64, macos-14)
    needs: application-candidate-mac
    if: ${{ needs.application-candidate-mac.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-14
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  packaged-acceptance-macos-26:
    name: Installed application (darwin-arm64, macos-26)
    needs: application-candidate-mac
    if: ${{ needs.application-candidate-mac.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-26
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  packaged-acceptance-windows:
    name: Installed application (win32-x64, configured Windows runner)
    needs: application-candidate-windows
    if: ${{ needs.application-candidate-windows.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      target: win32-x64
      app: Vibestudio.exe
    permissions:
      contents: read

  sign-linux-release-candidate:
    name: Sign and verify the Linux release candidate before tagging
    needs: [linux-installer-x64, linux-installer-arm64]
    if: ${{ inputs.release-preparation && vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact Linux x64 release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-linux-x64-${{ github.sha }}
          path: release
      - name: Download exact Linux arm64 release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-linux-arm64-${{ github.sha }}
          path: release
      - name: Verify Linux installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux-*
      - name: Sign and verify RPMs, then checksum final installers
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          SIGNING_KEY: ${{ vars.LINUX_SIGNING_KEY_ID || 'packages@vibestudio.app' }}
        run: |
          test -n "$LINUX_SIGNING_KEY"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
          printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
          bash scripts/publish/sign-linux-installers.sh release
      - name: Upload immutable signed Linux release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-linux-release-${{ github.sha }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 14

  macos-release-candidate:
    name: Package macOS release installers from the accepted app candidate
    needs: application-candidate-mac
    if: ${{ inputs.release-preparation && vars.RELEASE_MAC == 'true' }}
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release version and source commit
        run: node scripts/check-release-version.mjs "${{ inputs.release-tag }}" --source-sha "${{ github.sha }}"
      - name: Download the canonical tested macOS application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-app-darwin-arm64-${{ github.sha }}
          path: candidate-app
      - name: Download macOS release signing mode
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-macos-signing-${{ github.sha }}
          path: candidate-signing
      - name: Download macOS application provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-macos-provenance-${{ github.sha }}
          path: candidate-provenance
      - name: Verify exact macOS app archive provenance
        run: >-
          node scripts/release-app-candidate.mjs verify
          candidate-app/packaged-app.zip
          candidate-provenance/macos-release-provenance.json
          "${{ inputs.release-tag }}" "${{ github.sha }}"
      - name: Restore and verify the exact tested application
        shell: bash
        run: |
          mkdir -p release
          ditto -x -k candidate-app/packaged-app.zip release
          cp candidate-signing/macos-signing.txt release/macos-signing.txt
          test -d release/Vibestudio.app
          codesign --verify --deep --strict --verbose=2 release/Vibestudio.app
          provenance_mode="$(node -p 'JSON.parse(require("fs").readFileSync("candidate-provenance/macos-release-provenance.json", "utf8")).signingMode')"
          test "$(cat release/macos-signing.txt)" = "$provenance_mode"
          case "$(cat release/macos-signing.txt)" in
            developer-id)
              xcrun stapler validate release/Vibestudio.app
              spctl --assess --type execute --verbose=2 release/Vibestudio.app
              ;;
            ad-hoc)
              echo "Packaging the deliberately ad-hoc signed application candidate."
              ;;
            *)
              echo "Unknown macOS signing mode." >&2
              exit 1
              ;;
          esac
      - name: Build DMG and updater ZIP from the accepted application
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing=$((missing + 1)); fi
          done
          signing_mode="$(cat release/macos-signing.txt)"
          if [ "$missing" -eq 0 ] && [ "$signing_mode" = "developer-id" ]; then
            pnpm exec electron-builder --mac --prepackaged release/Vibestudio.app --publish never
          elif [ "$missing" -eq 5 ] && [ "$signing_mode" = "ad-hoc" ]; then
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --prepackaged release/Vibestudio.app --publish never
          else
            echo "Apple signing credentials and the tested app signing mode do not agree." >&2
            exit 1
          fi
      - name: Generate DMG checksums
        run: |
          cd release
          test -f latest-mac.yml
          ls ./*.zip >/dev/null
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macos
          test -s SHA256SUMS-macos
      - name: Download source-attested Darwin process observers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer
      - name: Archive source-attested Darwin process observers
        run: |
          tar -czf release/darwin-process-observers.tar.gz -C dist native-process-observer
          (cd release && shasum -a 256 darwin-process-observers.tar.gz > SHA256SUMS-darwin-process-observers)
      - name: Upload immutable macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/macos-signing.txt
            release/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 7
      - name: Upload immutable Darwin process observer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-process-observers-release-${{ github.sha }}
          path: |
            release/darwin-process-observers.tar.gz
            release/SHA256SUMS-darwin-process-observers
          if-no-files-found: error
          retention-days: 30

  accept-macos-release-candidate:
    name: Install and launch the exact macOS release candidate
    needs: macos-release-candidate
    if: ${{ inputs.release-preparation && vars.RELEASE_MAC == 'true' }}
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download immutable release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: candidate
      - name: Verify, install, and launch the DMG
        shell: bash
        run: |
          (cd candidate && shasum -a 256 --check SHA256SUMS-macos)
          images=(candidate/*.dmg)
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/vibestudio-dmg"
          mkdir -p "$mount" installed
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Vibestudio.app" installed/Vibestudio.app
          codesign --verify --deep --strict --verbose=2 installed/Vibestudio.app
          signing_mode="$(cat candidate/macos-signing.txt)"
          case "$signing_mode" in
            developer-id)
              xcrun stapler validate installed/Vibestudio.app
              spctl --assess --type execute --verbose=2 installed/Vibestudio.app
              ;;
            ad-hoc)
              echo "Acceptance matches the deliberately ad-hoc signed release candidate."
              ;;
            *)
              echo "Unknown macOS signing mode: $signing_mode" >&2
              exit 1
              ;;
          esac
          node scripts/packaged-isolation-smoke.mjs --app installed/Vibestudio.app --out-dir test-results/packaged-isolation
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-acceptance-macos
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
