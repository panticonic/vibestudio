name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      base-ref:
        type: string
        default: main
      windows-runner:
        type: string
        default: windows-2025
  workflow_dispatch:
    inputs:
      base-ref:
        description: Exact Base commit or branch paired with this host revision
        type: string
        default: main
        required: true
      windows-runner:
        description: Windows runner label (use a configured Windows 11 desktop runner for desktop acceptance)
        type: string
        default: windows-2025
        required: true

permissions: {}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      VIBESTUDIO_USERLAND_ROOT: ${{ github.workspace }}/vibestudio-workspace-base
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout current Base userland
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: panticonic/vibestudio-workspace-base
          ref: ${{ inputs.base-ref || 'main' }}
          path: vibestudio-workspace-base
          persist-credentials: false

      - name: Name the isolated Base checkout
        run: git -C vibestudio-workspace-base switch -c ci-acceptance-base

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Linux sandbox runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow bundled MXC user namespace under AppArmor
        run: |
          profile="$RUNNER_TEMP/vibestudio-mxc-lxc-exec.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile vibestudio_mxc_lxc_exec "$GITHUB_WORKSPACE/dist/mxc/linux-x64/lxc-exec" flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -m 0644 "$profile" /etc/apparmor.d/vibestudio-mxc-lxc-exec
          sudo apparmor_parser -r /etc/apparmor.d/vibestudio-mxc-lxc-exec

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check acceptance and native preparation harnesses
        run: node --test scripts/packaged-isolation-smoke.test.mjs scripts/native-host-dependencies.test.mjs scripts/node-runtime-artifacts.test.mjs scripts/with-macos-test-keychain.test.mjs scripts/branded-electron.test.mjs

      - name: Type-check
        run: pnpm type-check

      - name: Base type-check and complete userland suite
        run: pnpm test:pair

      - name: Mobile host and Iroh integration suites
        run: pnpm test:mobile

      - name: Host/workspace boundary
        run: pnpm check:host-boundary

      - name: Production host builds without userland source
        run: pnpm test:host-build-without-workspace

      - name: Production Electron Node-mode native workspace receiver
        run: ELECTRON_RUN_AS_NODE=1 pnpm exec electron node_modules/vitest/vitest.mjs run src/server/nativeWorkspaceRuntime.integration.test.ts

      - name: Linux native Claude launch contract
        run: pnpm vitest run packages/shared/src/claudeNativeLaunch.test.ts

      - name: Native Iroh remote transport
        run: pnpm test:remote-transport

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop Iroh pairing, approvals, panels, relaunch, and recovery
        run: pnpm test:iroh-desktop-e2e

      - name: Unit tests
        run: pnpm test

  mac-portability:
    name: macOS portability
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure packages
        run: pnpm build:infrastructure

      - name: Exercise macOS-sensitive host paths
        run: >-
          pnpm vitest run
          src/server/historicalHostSnapshot.test.ts
          src/server/historicalWorkspaceHost.test.ts
          src/server/hubServer.test.ts
          tests/npmUpdateLauncher.test.ts
          packages/extension-host/src/atomicStorage.test.ts
          src/server/storage/blobCas.test.ts

      - name: Exercise macOS release checksum tooling
        run: |
          checksum_dir="$RUNNER_TEMP/vibestudio-checksum-smoke"
          mkdir -p "$checksum_dir"
          touch "$checksum_dir/Vibestudio test.dmg"
          cd "$checksum_dir"
          shasum -a 256 ./*.dmg > SHA256SUMS-macos
          test "$(wc -l < SHA256SUMS-macos)" -eq 1

  native-isolation:
    name: Native workspace execution (${{ matrix.target }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-14
            target: darwin-arm64
            package: true
          - runner: macos-26
            target: darwin-arm64
            additional: true
          - runner: ${{ inputs.windows-runner || 'windows-2025' }}
            target: win32-x64
            package: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare and exercise native dependencies
        run: pnpm check:native-host-dependencies --repair

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Stage MXC executor payload
        run: node scripts/build-native-isolation.mjs

      - name: Build production application and headless host
        id: production-build
        run: pnpm build

      - name: Check native execution and platform permissions
        id: native-check
        run: pnpm vitest run --config packages/process-adapter/vitest.native.config.ts

      - name: Diagnose macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.native-check.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100

      - name: Check Windows host execution as a standard user
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.production-build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/test-native-standard-user.ps1

      - name: Upload tested native release input
        if: ${{ !matrix.additional && matrix.target != 'win32-x64' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-isolation-${{ matrix.target }}
          path: dist/mxc/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30

      - name: Checkout Base for desktop integration
        id: desktop-base
        if: ${{ !cancelled() && runner.os != 'Linux' && steps.production-build.outcome == 'success' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: panticonic/vibestudio-workspace-base
          ref: ${{ inputs.base-ref || 'main' }}
          path: vibestudio-workspace-base
          persist-credentials: false

      # Native, desktop and installed acceptance report independently. A failed
      # native assertion still fails this required job and cannot publish a release.
      - name: Assemble packaging input
        id: packaging-input
        if: ${{ !cancelled() && matrix.package && matrix.target != 'win32-x64' && steps.production-build.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p native/isolation/artifacts/native-isolation-${{ matrix.target }}
          cp dist/mxc/${{ matrix.target }}/* native/isolation/artifacts/native-isolation-${{ matrix.target }}/

      - name: Package the application
        id: package
        if: ${{ !cancelled() && matrix.package && steps.production-build.outcome == 'success' && (matrix.target == 'win32-x64' || steps.packaging-input.outcome == 'success') }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --dir --publish never

      # A tar archive preserves executable modes and macOS framework symlinks.
      - name: Archive installed application layout
        id: archive
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            tar -cf packaged-app.tar -C release/mac-arm64 Vibestudio.app
          else
            tar -cf packaged-app.tar -C release/win-unpacked .
          fi

      - name: Upload application for independent acceptance
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-app-${{ matrix.target }}
          path: packaged-app.tar
          if-no-files-found: error
          retention-days: 7

      # Source bootstrap can rebuild dist; capture the production candidate first.
      - name: Desktop pairing, approvals, panels, relaunch, and recovery
        if: ${{ !cancelled() && steps.desktop-base.outcome == 'success' }}
        shell: bash
        run: |
          git -C vibestudio-workspace-base switch -c ci-acceptance-base
          if [[ "$RUNNER_OS" == macOS ]]; then
            bash scripts/with-macos-test-keychain.sh node scripts/desktop-pairing-smoke.mjs --base-checkout vibestudio-workspace-base
          else
            node scripts/desktop-pairing-smoke.mjs --base-checkout vibestudio-workspace-base
          fi

  packaged-acceptance:
    name: Installed application (${{ matrix.target }}, ${{ matrix.runner }})
    needs: native-isolation
    # Exercise available platform candidates even if another platform failed.
    # Missing artifacts still fail acceptance; the native gate remains required.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-arm64
            app: Vibestudio.app
          - runner: macos-26
            target: darwin-arm64
            app: Vibestudio.app
          - runner: ${{ inputs.windows-runner || 'windows-2025' }}
            target: win32-x64
            app: Vibestudio.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout test harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download application built in another job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packaged-app-${{ matrix.target }}
          path: candidate
      - name: Extract application
        shell: bash
        run: |
          mkdir installed
          tar -xf candidate/packaged-app.tar -C installed
      - name: Launch installed desktop and workspace containment smoke
        id: installed-smoke
        run: node scripts/packaged-isolation-smoke.mjs --app "installed/${{ matrix.app }}" --out-dir test-results/packaged-isolation
      - name: Diagnose installed macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.installed-smoke.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packaged-acceptance-${{ matrix.runner }}
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
