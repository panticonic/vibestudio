name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release-candidate:
        description: Produce a complete protected-main release candidate (for an exact-SHA CI retry)
        type: boolean
        default: false
        required: true
      base-ref:
        description: Exact Base template commit or branch paired with this host revision
        type: string
        default: main
        required: true
      windows-runner:
        description: Windows runner label (use a configured Windows 11 desktop runner for desktop acceptance)
        type: string
        default: windows-2025
        required: true

permissions: {}

jobs:
  release-metadata:
    name: Resolve protected-main release version
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release-candidate)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      candidate-needed: ${{ steps.availability.outputs.needed }}
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify stable committed version and source
        id: version
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          node scripts/check-release-version.mjs "$tag" --source-sha "$SOURCE_SHA"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Restrict explicit candidate retries to canonical inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BASE_REF: ${{ inputs.base-ref }}
          WINDOWS_RUNNER: ${{ inputs.windows-runner }}
        run: |
          test "$BASE_REF" = main
          test "$WINDOWS_RUNNER" = windows-2025
      - name: Skip candidate packaging when this version is already tagged
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          tag_error="$RUNNER_TEMP/vibestudio-release-tag-query-error"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>"$tag_error"; then
            needed=false
          elif grep -q 'HTTP 404' "$tag_error"; then
            needed=true
          else
            cat "$tag_error" >&2
            exit 1
          fi
          printf 'needed=%s\n' "$needed" >> "$GITHUB_OUTPUT"
      - name: Require Linux repository signing before candidate production
        if: ${{ vars.RELEASE_LINUX == 'true' && steps.availability.outputs.needed == 'true' }}
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: test -n "$LINUX_SIGNING_KEY"

  quality-inputs:
    name: Prepare exact Linux quality inputs
    uses: ./.github/workflows/quality-inputs.yml
    with:
      base-ref: ${{ inputs.base-ref || 'main' }}
    permissions:
      contents: read

  quality:
    name: Quality Checks
    needs: quality-inputs
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Linux source runtime
        uses: ./.github/actions/setup-linux-source-runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact quality inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-quality-inputs-${{ github.sha }}

      - name: Restore and verify quality inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf quality-inputs.tar
          node scripts/ci-quality-inputs.mjs verify "$SOURCE_SHA" "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Check declared template runtime dependencies
        run: pnpm check:userland-dependencies

      - name: Check GitHub Actions workflows
        run: pnpm check:workflows

      - name: Check acceptance and native preparation harnesses
        run: node --test scripts/source-server-prerequisites.test.mjs scripts/host-build-generations.test.mjs scripts/host-build-fingerprint.test.mjs scripts/lib/npm-runtime-script-closure.test.mjs scripts/packaged-isolation-smoke.test.mjs scripts/native-host-dependencies.test.mjs scripts/node-runtime-artifacts.test.mjs scripts/macos-test-keychain.test.mjs scripts/branded-electron.test.mjs apps/mobile/metro.config.test.cjs

      - name: Type-check
        run: pnpm type-check

      - name: Template type-check and complete userland suite
        run: pnpm test:pair

  quality-followup:
    name: Remaining Linux quality checks
    needs: quality-inputs
    uses: ./.github/workflows/quality-linux.yml
    permissions:
      contents: read

  quality-desktop:
    name: Desktop Iroh source integration
    needs: quality-inputs
    uses: ./.github/workflows/quality-desktop.yml
    permissions:
      contents: read

  mac-portability:
    name: macOS portability
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure packages
        run: pnpm build:infrastructure

      - name: Prepare the current desktop host generation
        run: NODE_ENV=development node scripts/ensure-host-build.mjs

      - name: Exercise macOS-sensitive host paths
        run: >-
          pnpm vitest run
          src/server/historicalHostSnapshot.test.ts
          src/server/historicalWorkspaceHost.test.ts
          src/server/hubServer.test.ts
          packages/extension-host/src/atomicStorage.test.ts
          src/server/storage/blobCas.test.ts

      - name: Exercise macOS release checksum tooling
        run: |
          checksum_dir="$RUNNER_TEMP/vibestudio-checksum-smoke"
          mkdir -p "$checksum_dir"
          touch "$checksum_dir/Vibestudio test.dmg"
          cd "$checksum_dir"
          shasum -a 256 ./*.dmg > SHA256SUMS-macos
          test "$(wc -l < SHA256SUMS-macos)" -eq 1

  native-input-linux-x64:
    name: Prepare native release input (linux-x64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04
      target: linux-x64
    permissions:
      contents: read

  native-input-linux-arm64:
    name: Prepare native release input (linux-arm64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: ubuntu-22.04-arm
      target: linux-arm64
    permissions:
      contents: read

  native-input-darwin-arm64:
    name: Prepare native release input (darwin-arm64)
    uses: ./.github/workflows/native-input.yml
    with:
      runner: macos-14
      target: darwin-arm64
    permissions:
      contents: read

  linux-installer-x64:
    name: Build Linux x64 installer candidate
    # Release candidates need only their matching native input. These jobs run
    # Protected-main CI produces the canonical pre-tag candidate once.
    needs: [native-input-linux-x64, release-metadata]
    if: ${{ vars.RELEASE_LINUX == 'true' && needs.release-metadata.outputs.candidate-needed == 'true' }}
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04
      arch: x64
      release-tag: ${{ needs.release-metadata.outputs.tag }}
    permissions:
      contents: read

  linux-installer-arm64:
    name: Build Linux arm64 installer candidate
    needs: [native-input-linux-arm64, release-metadata]
    if: ${{ vars.RELEASE_LINUX == 'true' && needs.release-metadata.outputs.candidate-needed == 'true' }}
    uses: ./.github/workflows/linux-installer.yml
    with:
      runner: ubuntu-24.04-arm
      arch: arm64
      release-tag: ${{ needs.release-metadata.outputs.tag }}
    permissions:
      contents: read

  native-isolation-linux-x64:
    name: Verify native workspace execution (linux-x64)
    needs: native-input-linux-x64
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: ubuntu-22.04
      target: linux-x64
    permissions:
      contents: read

  native-isolation-linux-arm64:
    name: Verify native workspace execution (linux-arm64)
    needs: native-input-linux-arm64
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: ubuntu-22.04-arm
      target: linux-arm64
    permissions:
      contents: read

  native-isolation-darwin-arm64:
    name: Verify native workspace execution (darwin-arm64)
    needs:
      - native-input-darwin-arm64
      - darwin-development-inputs
    uses: ./.github/workflows/native-verification.yml
    with:
      runner: macos-26
      target: darwin-arm64
    permissions:
      contents: read

  darwin-production-host:
    name: Build and verify exact Darwin production host inputs
    needs: native-input-darwin-arm64
    uses: ./.github/workflows/darwin-production-host.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  application-candidate-mac:
    name: Package macOS application candidate from tested host inputs
    needs: [darwin-production-host, release-metadata]
    if: ${{ !cancelled() && needs.darwin-production-host.result == 'success' }}
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: macos-14
      target: darwin-arm64
      package: mac
      release-candidate: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' }}
      release-tag: ${{ needs.release-metadata.outputs.tag }}
    secrets:
      APPLE_CSC_LINK: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' && secrets.APPLE_CSC_LINK || '' }}
      APPLE_CSC_KEY_PASSWORD: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' && secrets.APPLE_CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ needs.release-metadata.outputs.candidate-needed == 'true' && vars.RELEASE_MAC == 'true' && secrets.APPLE_TEAM_ID || '' }}
    permissions:
      contents: read

  darwin-development-inputs:
    name: Prepare exact Darwin development host and workspace release
    needs: [darwin-production-host, quality-inputs]
    uses: ./.github/workflows/darwin-host-inputs.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  desktop-source-integration-macos-14:
    name: Development desktop source integration (macos-14)
    needs: darwin-development-inputs
    uses: ./.github/workflows/desktop-source-integration.yml
    with:
      runner: macos-14
    permissions:
      contents: read

  application-candidate-windows:
    name: Package Windows application candidate and verify native execution
    uses: ./.github/workflows/application-candidate.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      target: win32-x64
      package: windows
    permissions:
      contents: read

  windows-installer-candidate:
    name: Package NSIS installer from the tested Windows application
    needs: [application-candidate-windows, release-metadata]
    if: ${{ vars.RELEASE_WINDOWS == 'true' && needs.release-metadata.outputs.candidate-needed == 'true' }}
    uses: ./.github/workflows/windows-installer.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      release-tag: ${{ needs.release-metadata.outputs.tag }}
    permissions:
      contents: read

  npm-server-preflight:
    name: Staged headless server npm candidate
    # The universal candidate consumes all three prepared inputs, not native test results.
    needs:
      - native-input-linux-x64
      - native-input-linux-arm64
      - native-input-darwin-arm64
      - quality-inputs
    uses: ./.github/workflows/npm-server-preflight.yml
    permissions:
      contents: read

  packaged-acceptance-macos-14:
    name: Installed application (darwin-arm64, macos-14)
    needs: application-candidate-mac
    if: ${{ needs.application-candidate-mac.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-14
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  packaged-acceptance-macos-26:
    name: Installed application (darwin-arm64, macos-26)
    needs: application-candidate-mac
    if: ${{ needs.application-candidate-mac.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: macos-26
      target: darwin-arm64
      app: Vibestudio.app
    permissions:
      contents: read

  packaged-acceptance-windows:
    name: Installed application (win32-x64, configured Windows runner)
    needs: application-candidate-windows
    if: ${{ needs.application-candidate-windows.result == 'success' }}
    uses: ./.github/workflows/packaged-acceptance.yml
    with:
      runner: ${{ inputs.windows-runner || 'windows-2025' }}
      target: win32-x64
      app: Vibestudio.exe
    permissions:
      contents: read

  sign-linux-release-candidate:
    name: Sign and verify the Linux release candidate before tagging
    needs: [linux-installer-x64, linux-installer-arm64]
    if: ${{ needs.linux-installer-x64.result == 'success' && needs.linux-installer-arm64.result == 'success' && vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact Linux x64 release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-linux-x64-${{ github.sha }}
          path: release
      - name: Download exact Linux arm64 release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-linux-arm64-${{ github.sha }}
          path: release
      - name: Verify Linux installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux-*
      - name: Sign and verify RPMs, then checksum final installers
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          SIGNING_KEY: ${{ vars.LINUX_SIGNING_KEY_ID || 'packages@vibestudio.app' }}
        run: |
          test -n "$LINUX_SIGNING_KEY"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
          printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
          bash scripts/publish/sign-linux-installers.sh release
      - name: Upload immutable signed Linux release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-linux-release-${{ github.sha }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 14

  macos-release-candidate:
    name: Package macOS release installers from the accepted app candidate
    needs: [application-candidate-mac, release-metadata]
    if: ${{ vars.RELEASE_MAC == 'true' && needs.release-metadata.outputs.candidate-needed == 'true' }}
    uses: ./.github/workflows/macos-release-candidate.yml
    with:
      release-tag: ${{ needs.release-metadata.outputs.tag }}
    permissions:
      contents: read

  accept-macos-release-candidate:
    name: Install and launch the exact macOS release candidate
    needs: macos-release-candidate
    if: ${{ needs.macos-release-candidate.result == 'success' && vars.RELEASE_MAC == 'true' }}
    uses: ./.github/workflows/accept-macos-release-candidate.yml
    permissions:
      contents: read

  release-candidate-gate:
    name: Release candidate gate
    needs:
      - release-metadata
      - quality
      - quality-followup
      - quality-desktop
      - mac-portability
      - native-isolation-linux-x64
      - native-isolation-linux-arm64
      - native-isolation-darwin-arm64
      - desktop-source-integration-macos-14
      - npm-server-preflight
      - packaged-acceptance-macos-14
      - packaged-acceptance-macos-26
      - packaged-acceptance-windows
      - sign-linux-release-candidate
      - windows-installer-candidate
      - accept-macos-release-candidate
    if: ${{ always() && needs.release-metadata.outputs.candidate-needed == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout candidate gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact quality template inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-quality-manifest-${{ github.sha }}
          path: .cache/release-gate
      - name: Require every applicable quality and candidate result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
          CANDIDATE_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_LINUX: ${{ vars.RELEASE_LINUX }}
          RELEASE_MAC: ${{ vars.RELEASE_MAC }}
          RELEASE_WINDOWS: ${{ vars.RELEASE_WINDOWS }}
          WINDOWS_RUNNER: ${{ inputs.windows-runner || 'windows-2025' }}
        run: node scripts/release-ci-gate.mjs
      - name: Upload exact candidate gate receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-release-gate-${{ github.sha }}
          path: release-candidate-gate.json
          if-no-files-found: error
          retention-days: 14
