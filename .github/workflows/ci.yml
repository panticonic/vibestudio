name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Host/workspace boundary
        run: pnpm check:host-boundary

      - name: Production host builds without userland source
        run: pnpm test:host-build-without-workspace

      - name: Native Iroh remote transport
        run: pnpm test:remote-transport

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit tests
        run: pnpm test

  mac-portability:
    name: macOS portability
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build infrastructure packages
        run: pnpm build:infrastructure

      - name: Exercise macOS-sensitive host paths
        run: >-
          pnpm vitest run
          src/server/historicalHostSnapshot.test.ts
          src/server/historicalWorkspaceHost.test.ts
          src/server/hubServer.test.ts
          tests/npmUpdateLauncher.test.ts
          packages/extension-host/src/atomicStorage.test.ts
          src/server/storage/blobCas.test.ts

      - name: Exercise macOS release checksum tooling
        run: |
          checksum_dir="$RUNNER_TEMP/vibestudio-checksum-smoke"
          mkdir -p "$checksum_dir"
          touch "$checksum_dir/Vibestudio test.dmg"
          cd "$checksum_dir"
          shasum -a 256 ./*.dmg > SHA256SUMS-macos
          test "$(wc -l < SHA256SUMS-macos)" -eq 1
