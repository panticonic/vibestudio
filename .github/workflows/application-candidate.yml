name: Build and verify application candidate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      package:
        type: string
        required: true
      release-candidate:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ""
    secrets:
      APPLE_CSC_LINK:
        required: false
      APPLE_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions: {}

jobs:
  candidate:
    name: Candidate ${{ inputs.target }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact Darwin production host inputs
        if: ${{ inputs.target == 'darwin-arm64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-darwin-host-production-${{ github.sha }}
          path: .cache/host-inputs

      - name: Restore and verify exact Darwin production host inputs
        id: restore-host-inputs
        if: ${{ inputs.target == 'darwin-arm64' }}
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf .cache/host-inputs/darwin-host-inputs.tar
          node scripts/ci-host-build-inputs.mjs verify --source-sha "$SOURCE_SHA" --desktop-mode production

      - name: Verify exact release version and source commit
        if: ${{ inputs.release-candidate }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG" --source-sha "$SOURCE_SHA"

      - name: Prepare and exercise native dependencies
        if: ${{ inputs.target != 'darwin-arm64' }}
        run: pnpm check:native-host-dependencies --repair

      - name: Build production application and headless host
        if: ${{ inputs.target != 'darwin-arm64' }}
        run: pnpm build

      - name: Report Windows long-path operating system policy
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $value = Get-ItemPropertyValue -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue
          Write-Host "Windows LongPathsEnabled=$value (1 is required for long workspace database paths; CI does not change this policy)"

      - name: Check native execution and platform permissions
        id: native-check
        if: ${{ inputs.target != 'darwin-arm64' }}
        run: pnpm vitest run --config packages/process-adapter/vitest.native.config.ts --reporter=default --reporter=json --outputFile=.cache/native-acceptance.json

      - name: Upload native acceptance report
        if: ${{ !cancelled() && (steps.native-check.outcome == 'success' || steps.native-check.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-${{ inputs.target }}-${{ inputs.runner }}
          path: .cache/native-acceptance.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.native-check.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100

      - name: Check Windows host execution as a standard user
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native-check.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/test-native-standard-user.ps1

      - name: Download the workspace release built once for this commit
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workspace-release-${{ github.sha }}
          path: .cache/workspace-release

      - name: Extract the workspace release
        shell: bash
        run: tar -xf .cache/workspace-release/workspace-release.tar -C .cache/workspace-release

      - name: Package the application
        id: package
        if: ${{ success() && ((inputs.target == 'darwin-arm64' && steps.restore-host-inputs.outcome == 'success') || (inputs.target != 'darwin-arm64' && steps.native-check.outcome == 'success')) }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TARGET: ${{ inputs.target }}
          RELEASE_CANDIDATE: ${{ inputs.release-candidate }}
          VIBESTUDIO_PREBUILT_WORKSPACE_RELEASE: ${{ github.workspace }}/.cache/workspace-release
        run: |
          # electron-builder treats an empty CSC_LINK as a path and resolves it
          # to the repository directory. With no signing secret, leave it unset.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK; fi
          if [ "$TARGET" = "darwin-arm64" ] && [ "$RELEASE_CANDIDATE" = "true" ]; then
            missing=0
            for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              value="${!name}"
              if [ -z "$value" ]; then missing=$((missing + 1)); fi
            done
            if [ "$missing" -eq 0 ]; then
              pnpm exec electron-builder --dir --publish never
              mkdir -p release && echo developer-id > release/macos-signing.txt
            elif [ "$missing" -eq 5 ]; then
              echo "::warning::No Apple identity configured; preparing an ad-hoc signed, unnotarized macOS candidate."
              CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --dir --publish never
              mkdir -p release && echo ad-hoc > release/macos-signing.txt
            else
              echo "Apple signing is partially configured: $missing of 5 credentials are missing." >&2
              echo "Set all five secrets to sign, or none to publish an unsigned build." >&2
              exit 1
            fi
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --dir --publish never
          fi

      - name: Archive installed application layout
        id: archive
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        env:
          PACKAGE_KIND: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE_KIND" = "mac" ]; then
            ditto -c -k --sequesterRsrc --keepParent release/mac-arm64/Vibestudio.app packaged-app.zip
          else
            tar -cf packaged-app.tar -C release/win-unpacked .
          fi

      - name: Attest the exact macOS release candidate
        if: ${{ inputs.package == 'mac' && inputs.release-candidate }}
        shell: bash
        env:
          RELEASE_DIR: release
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          node scripts/release-app-candidate.mjs create packaged-app.zip
          macos-release-provenance.json "$RELEASE_TAG" "$SOURCE_SHA"

      - name: Upload application for independent acceptance
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-${{ inputs.target }}-${{ github.sha }}
          path: packaged-app.*
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS release signing mode
        if: ${{ inputs.package == 'mac' && inputs.release-candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-macos-signing-${{ github.sha }}
          path: release/macos-signing.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload macOS release candidate provenance
        if: ${{ inputs.package == 'mac' && inputs.release-candidate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-macos-provenance-${{ github.sha }}
          path: macos-release-provenance.json
          if-no-files-found: error
          retention-days: 7
