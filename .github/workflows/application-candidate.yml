name: Build and verify application candidate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      package:
        type: string
        required: true
      base-ref:
        type: string
        default: main

permissions: {}

jobs:
  candidate:
    name: Candidate ${{ inputs.target }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared Darwin native release input
        if: ${{ inputs.target == 'darwin-arm64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-darwin-arm64
          path: native/isolation/artifacts/native-isolation-darwin-arm64

      - name: Download source-attested Darwin process observers
        if: ${{ inputs.target == 'darwin-arm64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer

      - name: Prepare and exercise native dependencies
        run: pnpm check:native-host-dependencies --repair

      - name: Build production application and headless host
        run: pnpm build

      - name: Use prepared Darwin native release input
        if: ${{ inputs.target == 'darwin-arm64' }}
        env:
          NATIVE_TARGET: darwin-arm64
        run: |
          node --input-type=module <<'NODE'
          import { assertNativeIsolationArtifacts, nativeIsolationTarget } from "./scripts/native-isolation-artifacts.mjs";
          const [platform, arch] = process.env.NATIVE_TARGET.split("-");
          assertNativeIsolationArtifacts(process.cwd(), undefined, [nativeIsolationTarget(platform, arch)]);
          NODE
          cp native/isolation/artifacts/native-isolation-darwin-arm64/* dist/mxc/darwin-arm64/
          chmod 0755 dist/mxc/darwin-arm64/mxc-exec-mac

      - name: Report Windows long-path operating system policy
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $value = Get-ItemPropertyValue -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue
          Write-Host "Windows LongPathsEnabled=$value (1 is required for long workspace database paths; CI does not change this policy)"

      - name: Check native execution and platform permissions
        id: native-check
        run: pnpm vitest run --config packages/process-adapter/vitest.native.config.ts --reporter=default --reporter=json --outputFile=.cache/native-acceptance.json

      - name: Upload native acceptance report
        if: ${{ !cancelled() && (steps.native-check.outcome == 'success' || steps.native-check.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-${{ inputs.target }}-${{ inputs.runner }}
          path: .cache/native-acceptance.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.native-check.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100

      - name: Check Windows host execution as a standard user
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.native-check.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/test-native-standard-user.ps1

      # Capture the production candidate before template bootstrap can replace
      # shared dist outputs with development artifacts for the desktop smoke.
      - name: Package the application
        id: package
        if: ${{ !cancelled() && steps.native-check.outcome == 'success' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --dir --publish never

      - name: Archive installed application layout
        id: archive
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: bash
        run: |
          if [ "${{ inputs.package }}" = "mac" ]; then
            tar -cf packaged-app.tar -C release/mac-arm64 Vibestudio.app
          else
            tar -cf packaged-app.tar -C release/win-unpacked .
          fi

      - name: Upload application for independent acceptance
        if: ${{ !cancelled() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-app-${{ inputs.target }}
          path: packaged-app.tar
          if-no-files-found: error
          retention-days: 7

      - name: Checkout Base template for desktop integration
        id: desktop-template-base
        if: ${{ !cancelled() && inputs.package == 'mac' && steps.native-check.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panticonic/vibestudio-base
          ref: ${{ inputs.base-ref }}
          path: vibestudio-templates/base
          persist-credentials: false

      - name: Acquire complete template source set for desktop integration
        id: desktop-templates
        if: ${{ !cancelled() && steps.desktop-template-base.outcome == 'success' }}
        shell: bash
        run: pnpm dev:templates setup "$GITHUB_WORKSPACE/vibestudio-templates"

      - name: Desktop pairing, approvals, panels, relaunch, and recovery
        id: desktop-smoke
        if: ${{ !cancelled() && steps.desktop-templates.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p test-results/desktop-pairing-smoke
          sudo tcpdump -i lo0 -n -l -tttt 'tcp[tcpflags] & (tcp-syn|tcp-fin|tcp-rst) != 0' > test-results/desktop-pairing-smoke/transport-diagnostics.log 2>&1 &
          capture_pid=$!
          trap 'sudo kill -TERM "$capture_pid"; wait "$capture_pid" || true' EXIT
          node scripts/desktop-pairing-smoke.mjs --template-checkouts "$GITHUB_WORKSPACE/vibestudio-templates"

      - name: Retain native HTTP connection evidence
        if: ${{ !cancelled() && (steps.desktop-smoke.outcome == 'success' || steps.desktop-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-http-connections-${{ inputs.target }}-${{ inputs.runner }}
          path: test-results/desktop-pairing-smoke/transport-diagnostics.log
          if-no-files-found: error
          retention-days: 3

      - name: Retain desktop onboarding failure evidence
        if: ${{ !cancelled() && steps.desktop-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-onboarding-diagnostics-${{ inputs.target }}-${{ inputs.runner }}
          path: |
            test-results/desktop-pairing-smoke/*diagnostics-*.json
            test-results/desktop-pairing-smoke/desktop-*.png
          if-no-files-found: warn
          retention-days: 3
