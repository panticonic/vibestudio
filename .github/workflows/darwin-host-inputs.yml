name: Prepare portable Darwin source integration inputs

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions: {}

jobs:
  prepare:
    name: Prepare development host and workspace release on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact official template input manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-quality-manifest-${{ github.sha }}
          path: .cache/ci-template-inputs

      - name: Download exact production host inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-darwin-host-production-${{ github.sha }}
          path: .cache/host-inputs

      - name: Restore and verify production host inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf .cache/host-inputs/darwin-host-inputs.tar
          node scripts/ci-host-build-inputs.mjs verify --source-sha "$SOURCE_SHA" --desktop-mode production

      - name: Acquire exact template source set
        run: pnpm dev:templates setup "$GITHUB_WORKSPACE/.cache/template-checkouts"

      - name: Pin every official template to the tested input
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/pin-ci-template-inputs.mjs "$SOURCE_SHA" "$GITHUB_WORKSPACE/.cache/ci-template-inputs/release-quality-inputs.json" "$GITHUB_WORKSPACE/.cache/template-checkouts"

      - name: Build development source host generation
        env:
          NODE_ENV: development
        run: node build.mjs --source-server-prereqs

      - name: Prepare development source host and canonical workspace release
        id: development-inputs
        env:
          NODE_ENV: development
        run: |
          mkdir -p "$RUNNER_TEMP"
          node scripts/prepare-development-workspace-release.mjs \
            --output "$GITHUB_WORKSPACE/.cache/ci-workspace-release" \
            --scratch "$RUNNER_TEMP/vibestudio-workspace-release-scratch" \
            --template-checkouts "$GITHUB_WORKSPACE/.cache/template-checkouts"

      - name: Verify and archive portable development inputs
        if: ${{ !cancelled() && steps.development-inputs.outcome == 'success' }}
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/ci-host-build-inputs.mjs write --source-sha "$SOURCE_SHA" --desktop-mode production --source-mode development --template-root "$GITHUB_WORKSPACE/.cache/template-checkouts"
          shopt -s nullglob
          package_dists=(packages/*/dist)
          test "${#package_dists[@]}" -gt 0
          tar -cf darwin-source-inputs.tar --exclude=dist/host-generations/.leases --exclude=dist/host-generations/.lock --exclude='dist/host-generations/.garbage-*' --exclude='dist/host-generations/.staging-*' .cache/darwin-host-inputs.json .cache/vibestudio-infrastructure-build.json .cache/ci-workspace-release .cache/template-checkouts dist native/isolation/artifacts/native-isolation-darwin-arm64 "${package_dists[@]}"

      - name: Upload exact development source inputs
        if: ${{ !cancelled() && steps.development-inputs.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-darwin-source-inputs-${{ github.sha }}
          path: darwin-source-inputs.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Retire prepared workspace output
        if: ${{ always() }}
        run: rm -rf -- "$GITHUB_WORKSPACE/.cache/ci-workspace-release"
