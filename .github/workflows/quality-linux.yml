name: Remaining Linux quality checks

on:
  workflow_call:

jobs:
  quality-followup:
    name: Remaining Linux quality checks
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Linux source runtime
        uses: ./.github/actions/setup-linux-source-runtime

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact quality inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-quality-inputs-${{ github.sha }}

      - name: Restore and verify quality inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tar -xf quality-inputs.tar
          node scripts/ci-quality-inputs.mjs verify "$SOURCE_SHA" "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Mobile host and Iroh integration suites
        run: pnpm test:mobile

      - name: Host/workspace boundary
        run: pnpm check:host-boundary

      - name: Production host builds without userland source
        run: pnpm test:host-build-without-workspace

      - name: Production Electron Node-mode native workspace receiver
        run: ELECTRON_RUN_AS_NODE=1 pnpm exec electron node_modules/vitest/vitest.mjs run src/server/nativeWorkspaceRuntime.integration.test.ts

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test
