name: Accept installed application candidate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      app:
        type: string
        required: true

permissions: {}

jobs:
  acceptance:
    name: Install and accept ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The harness scripts own their processes through packages/shared, which
      # reads profile paths from the compiled env-paths package.
      - name: Build the infrastructure packages the harness imports
        run: pnpm build:infrastructure
      # On macOS the harness's process ownership finds its native observer under dist/.
      - name: Download source-attested Darwin process observers
        if: startsWith(inputs.target, 'darwin')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer
          if-no-artifact-found: error
      # Artifact transfer drops the executable mode; this authenticates the binary
      # against its source receipt before restoring it.
      - name: Authenticate and restore the Darwin process observers
        if: startsWith(inputs.target, 'darwin')
        run: pnpm prepare:darwin-process-observers
      - name: Download application built in another job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packaged-app-${{ inputs.target }}-${{ github.sha }}
          path: candidate
          if-no-artifact-found: error
      - name: Extract application
        shell: bash
        run: |
          mkdir installed
          if [ "${{ inputs.target }}" = "darwin-arm64" ]; then
            ditto -x -k candidate/packaged-app.zip installed
          else
            tar -xf candidate/packaged-app.tar -C installed
          fi
      - name: Launch installed desktop and workspace containment smoke
        id: installed-smoke
        run: node scripts/packaged-isolation-smoke.mjs --app "installed/${{ inputs.app }}" --out-dir test-results/packaged-isolation
      - name: Diagnose installed macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.installed-smoke.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-acceptance-${{ inputs.runner }}
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
