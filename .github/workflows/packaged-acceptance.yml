name: Accept installed application candidate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      app:
        type: string
        required: true

permissions: {}

jobs:
  acceptance:
    name: Install and accept ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout test harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download application built in another job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packaged-app-${{ inputs.target }}
          path: candidate
          if-no-artifact-found: error
      - name: Extract application
        shell: bash
        run: |
          mkdir installed
          tar -xf candidate/packaged-app.tar -C installed
      - name: Launch installed desktop and workspace containment smoke
        id: installed-smoke
        run: node scripts/packaged-isolation-smoke.mjs --app "installed/${{ inputs.app }}" --out-dir test-results/packaged-isolation
      - name: Diagnose installed macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.installed-smoke.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-acceptance-${{ inputs.runner }}
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
