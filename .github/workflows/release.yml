name: Release

# Tag a validated release with `v*` (e.g. v0.2.0) to create the GitHub release and
# build the native installers. Nothing here publishes to npm; the npm packages are
# a separate manual `pnpm publish:server-npm`, and only the headless server is
# published there, for hosts no native package covers.
#   - vars.RELEASE_LINUX = 'true'  → deb/rpm/pacman, plus the signed apt and
#     dnf repositories on GitHub Pages (needs build-resources icons and LINUX_SIGNING_KEY)
#   - vars.RELEASE_WINDOWS = 'true' → x64 NSIS installer, unsigned unless a certificate is added
#   - vars.RELEASE_MAC   = 'true'  → DMG, signed and notarized when all five Apple secrets
#     are set and ad-hoc signed otherwise
# The Homebrew cask is not built here: panticonic/homebrew-tap tracks releases itself.
on:
  push:
    tags: ["v*"]

# Jobs opt into only the token authority they need. Artifact upload/download uses
# GitHub's run-scoped artifact token, not a repository-write GITHUB_TOKEN.
permissions: {}

jobs:
  release-quality:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  github-release:
    name: Create GitHub release
    needs: release-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify tag matches the committed package version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          body: |
            ### Install

            **Debian / Ubuntu** — updates arrive with `apt upgrade`.

            ```sh
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://panticonic.github.io/vibestudio/gpg.key \
              | sudo tee /etc/apt/keyrings/vibestudio.asc > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/vibestudio.asc] https://panticonic.github.io/vibestudio/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vibestudio.list
            sudo apt update && sudo apt install vibestudio
            ```

            **Fedora / RHEL / openSUSE** — updates arrive with `dnf upgrade`.

            ```sh
            sudo rpm --import https://panticonic.github.io/vibestudio/gpg.key
            sudo dnf config-manager --add-repo https://panticonic.github.io/vibestudio/rpm
            sudo dnf install vibestudio
            ```

            **macOS** — updates arrive with `brew upgrade`.

            ```sh
            brew install --cask panticonic/tap/vibestudio
            ```

            The macOS build is ad-hoc signed rather than signed with an Apple Developer ID,
            so macOS asks you to confirm it on first launch (System Settings → Privacy &
            Security → Open Anyway). It cannot update itself; `brew upgrade` is the update path.

            **Windows** — download the `.exe` installer below. It is not yet code signed,
            so SmartScreen will warn on first run.

            **Arch, or any distro without a repository** — the `.pkg.tar.zst`, `.rpm` and
            `.deb` files below install directly. Every packaged format carries the AppArmor
            profile that a workspace sandbox needs on Ubuntu 24.04+.

            **A server on a host we do not package** — npm carries the headless server and
            CLI, and needs Node.js 22.19+.

            ```sh
            npm install -g @panticonic/vibestudio-server
            ```

  linux-installers:
    name: Build Linux installers (deb/rpm/pacman)
    needs: github-release
    if: ${{ vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches the committed package version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Download the tested MXC payload matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-isolation-*
          path: native/isolation/artifacts

      - name: Install Linux packaging tools
        # electron-builder shells out to fpm, which needs rpmbuild for rpm and
        # libarchive's bsdtar for pacman. deb needs neither.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Build Linux installers
        run: pnpm dist:linux

      - name: Generate installer checksums
        run: |
          cd release
          find . -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.rpm" -o -name "*.pkg.tar.zst" \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-linux
          test -s SHA256SUMS-linux

      - name: Upload immutable Linux release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibestudio-linux-${{ github.sha }}
          path: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS-linux
          if-no-files-found: error
          retention-days: 7

  publish-linux:
    name: Verify and publish Linux installers
    needs: [github-release, linux-installers]
    if: ${{ vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable Linux release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-linux-${{ github.sha }}
          path: release

      - name: Verify Linux installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux

      - name: Attach Linux installers to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS-linux

  publish-linux-repos:
    name: Publish signed apt and dnf repositories
    needs: [github-release, linux-installers]
    if: ${{ vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-latest
    # Pages deployment is its own authority; the repository contents token stays
    # out of this job, which only reads a verified artifact and writes a site.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download immutable Linux release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-linux-${{ github.sha }}
          path: release

      # Publish only what the build job actually produced and signed off on.
      - name: Verify Linux installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            apt-utils dpkg-dev createrepo-c rpm

      - name: Import the package signing key
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: |
          test -n "$LINUX_SIGNING_KEY" || {
            echo "LINUX_SIGNING_KEY is not configured; cannot sign the repositories" >&2
            exit 1
          }
          printf '%s' "$LINUX_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Build signed apt and dnf repositories
        env:
          SIGNING_KEY: ${{ vars.LINUX_SIGNING_KEY_ID || 'packages@vibestudio.app' }}
        run: ./scripts/publish/build-linux-repos.sh release site "${{ steps.pages.outputs.base_url }}"

      - name: Upload the repository site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  mac-dmg:
    name: Build, sign, and notarize macOS DMG
    needs: github-release
    if: ${{ vars.RELEASE_MAC == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches the committed package version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      # Compile before any signing secret enters the environment. electron-builder
      # currently couples macOS packaging, signing, and notarization in one command,
      # so only that irreducible step receives the Apple credentials.
      - name: Build application
        run: pnpm build

      - name: Download the tested MXC payload matrix
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-isolation-*
          path: native/isolation/artifacts

      # Signing is all-or-nothing: a half-configured Apple identity produces a
      # build that looks signed and fails notarization later, so either every
      # credential is present or the build is deliberately unsigned. An unsigned
      # build is still ad-hoc signed by the afterPack hook, because Apple Silicon
      # refuses to run a bundle carrying no signature at all.
      - name: Package, sign, and notarize macOS installers
        env:
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then missing=$((missing + 1)); fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "Signing and notarizing with the configured Apple identity."
            pnpm exec electron-builder --mac
          elif [ "$missing" -eq 5 ]; then
            echo "::warning::No Apple identity configured; publishing an ad-hoc signed, unnotarized macOS build. Gatekeeper will warn on first launch and it cannot auto-update."
            # Keep electron-builder from adopting a stray keychain identity on the
            # runner, so an unsigned build is unsigned deliberately rather than by
            # accident.
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac
          else
            echo "Apple signing is partially configured: $missing of 5 credentials are missing." >&2
            echo "Set all five secrets to sign, or none to publish an unsigned build." >&2
            exit 1
          fi

      - name: Generate DMG checksums
        run: |
          cd release
          shasum -a 256 ./*.dmg > SHA256SUMS-macos
          test -s SHA256SUMS-macos

      - name: Upload immutable macOS release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: |
            release/*.dmg
            release/SHA256SUMS-macos
          if-no-files-found: error
          retention-days: 7

  publish-macos:
    name: Verify and publish macOS DMG
    needs: [github-release, mac-dmg, accept-macos-installer]
    if: ${{ vars.RELEASE_MAC == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable macOS release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: release

      - name: Verify DMG checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-macos

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/*.dmg
            release/SHA256SUMS-macos

  windows-installer:
    name: Build Windows x64 installer
    needs: github-release
    if: ${{ vars.RELEASE_WINDOWS == 'true' }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag matches the committed package version
        run: node scripts/check-release-version.mjs "$env:GITHUB_REF_NAME"
      - name: Build application
        run: pnpm build
      - name: Package Windows installer
        run: pnpm exec electron-builder --win --x64 --publish never
      - name: Generate installer checksums
        shell: bash
        working-directory: release
        run: sha256sum ./*.exe > SHA256SUMS-windows
      - name: Upload immutable Windows release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vibestudio-windows-${{ github.sha }}
          path: |
            release/*.exe
            release/SHA256SUMS-windows
          if-no-files-found: error
          retention-days: 7

  publish-windows:
    name: Verify and publish Windows installer
    needs: [github-release, windows-installer, accept-windows-installer]
    if: ${{ vars.RELEASE_WINDOWS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download immutable Windows release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-windows-${{ github.sha }}
          path: release
      - name: Verify installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-windows
      - name: Attach installer to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS-windows

  accept-macos-installer:
    name: Install and launch signed macOS release candidate
    needs: mac-dmg
    if: ${{ vars.RELEASE_MAC == 'true' }}
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-macos-${{ github.sha }}
          path: candidate
      - name: Verify, install, and launch the DMG
        shell: bash
        run: |
          (cd candidate && shasum -a 256 --check SHA256SUMS-macos)
          images=(candidate/*.dmg)
          test "${#images[@]}" -eq 1
          mount="$RUNNER_TEMP/vibestudio-dmg"
          mkdir -p "$mount" installed
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/Vibestudio.app" installed/Vibestudio.app
          codesign --verify --deep --strict --verbose=2 installed/Vibestudio.app
          xcrun stapler validate installed/Vibestudio.app
          spctl --assess --type execute --verbose=2 installed/Vibestudio.app
          node scripts/packaged-isolation-smoke.mjs --app installed/Vibestudio.app --out-dir test-results/packaged-isolation
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-acceptance-macos
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7

  accept-windows-installer:
    name: Install and launch Windows release candidate
    needs: windows-installer
    if: ${{ vars.RELEASE_WINDOWS == 'true' }}
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install test dependencies (no application build)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vibestudio-windows-${{ github.sha }}
          path: candidate
      - name: Verify installer checksums
        shell: bash
        working-directory: candidate
        run: sha256sum --check SHA256SUMS-windows
      - name: Install and launch the NSIS release candidate
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem candidate/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'Vibestudio installed acceptance'
          $installer = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -PassThru
          if (-not $installer.WaitForExit(180000)) { $installer.Kill(); throw 'Installer timed out' }
          if ($installer.ExitCode -ne 0) { throw "Installer exited $($installer.ExitCode)" }
          try {
            node scripts/packaged-isolation-smoke.mjs --app "$destination/Vibestudio.exe" --out-dir test-results/packaged-isolation
            if ($LASTEXITCODE -ne 0) { throw 'Installed application acceptance failed' }
          } finally {
            $uninstaller = Join-Path $destination 'Uninstall Vibestudio.exe'
            if (Test-Path $uninstaller) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru
              if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Uninstaller timed out' }
              if ($process.ExitCode -ne 0) { throw "Uninstaller exited $($process.ExitCode)" }
            }
          }
      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-acceptance-windows
          path: test-results/packaged-isolation
          if-no-files-found: warn
          retention-days: 7
