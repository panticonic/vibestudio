name: Release

# Dispatch against an exact commit and requested version. Every enabled native
# candidate and its acceptance must pass before the workflow creates the tag.
# Nothing here publishes to npm; the headless server
# has a separate manual `pnpm publish:server-npm` path for hosts no native
# package covers.
#   - vars.RELEASE_LINUX = 'true'  → deb/rpm/pacman, plus the signed apt and
#     dnf repositories on GitHub Pages after this workflow succeeds
#     (needs build-resources icons and LINUX_SIGNING_KEY)
#   - vars.RELEASE_WINDOWS = 'true' → x64 NSIS installer, unsigned unless a certificate is added
#   - vars.RELEASE_MAC   = 'true'  → DMG/ZIP from the accepted app candidate,
#     signed and notarized when all five Apple secrets are set and ad-hoc signed otherwise
# The Homebrew cask is not built here: panticonic/homebrew-tap tracks releases itself.
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Version tag to create after all release candidates pass (for example v0.2.0)
        type: string
        required: true
      source-sha:
        description: Full commit SHA to validate and tag
        type: string
        required: true

# Jobs opt into only the token authority they need. Artifact upload/download uses
# GitHub's run-scoped artifact token, not a repository-write GITHUB_TOKEN.
permissions: {}

jobs:
  validate-release-input:
    name: Validate requested version and exact commit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout requested workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the protected release branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Verify version and exact checked-out source SHA
        run: node scripts/check-release-version.mjs "${{ inputs.release-tag }}" --source-sha "${{ inputs.source-sha }}"
      - name: Verify Linux repository signing is configured
        if: ${{ vars.RELEASE_LINUX == 'true' }}
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: test -n "$LINUX_SIGNING_KEY"

  release-quality:
    name: Validate release commit
    needs: validate-release-input
    uses: ./.github/workflows/ci.yml
    with:
      release-preparation: true
      release-tag: ${{ inputs.release-tag }}
    permissions:
      contents: read
    secrets:
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
      APPLE_CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
      APPLE_CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  create-release-tag:
    name: Create immutable release tag after all candidate gates
    needs: release-quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release-tag }}
      SOURCE_SHA: ${{ inputs.source-sha }}
    steps:
      - name: Create the tag at the exact validated commit
        run: |
          verify_existing_tag() {
            ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
            test "$(jq -r '.object.type' <<<"$ref_json")" = tag
            tag_object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
            tag_json="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
            test "$(jq -r '.object.sha' <<<"$tag_json")" = "$SOURCE_SHA"
            test "$(jq -r '.tag' <<<"$tag_json")" = "$RELEASE_TAG"
          }

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            verify_existing_tag
          else
            tag_object_sha="$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f "tag=$RELEASE_TAG" \
              -f "message=Release $RELEASE_TAG" \
              -f "object=$SOURCE_SHA" \
              -f "type=commit" \
              --jq '.sha')"
            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$tag_object_sha" >/dev/null; then
              echo "Tag ref creation raced with another writer; verifying the immutable ref."
            fi
            verify_existing_tag
          fi

  github-release:
    name: Create draft GitHub release
    needs: create-release-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          target_commitish: ${{ inputs.source-sha }}
          draft: true
          generate_release_notes: true
          body: |
            ### Install

            **Debian / Ubuntu** — updates arrive with `apt upgrade`.

            ```sh
            sudo install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://panticonic.github.io/vibestudio/gpg.key \
              | sudo tee /etc/apt/keyrings/vibestudio.asc > /dev/null
            echo "deb [signed-by=/etc/apt/keyrings/vibestudio.asc] https://panticonic.github.io/vibestudio/apt stable main" \
              | sudo tee /etc/apt/sources.list.d/vibestudio.list
            sudo apt update && sudo apt install vibestudio
            ```

            **Fedora / RHEL / openSUSE** — updates arrive with `dnf upgrade`.

            ```sh
            sudo rpm --import https://panticonic.github.io/vibestudio/gpg.key
            sudo dnf config-manager --add-repo https://panticonic.github.io/vibestudio/rpm
            sudo dnf install Vibestudio
            ```

            **macOS** — [download the DMG](https://vibestudio.app/download/mac) (Apple Silicon, macOS 14+)
            or install through Homebrew:

            ```sh
            brew install --cask panticonic/tap/vibestudio
            ```

            The macOS app is signed and notarized when all Apple credentials are configured.
            Otherwise it is ad-hoc signed and macOS asks you to confirm it on first launch
            (System Settings → Privacy & Security → Open Anyway). The app checks for
            updates and offers the new DMG: quit, replace Vibestudio in Applications,
            then reopen it. Homebrew installs offer to run `brew upgrade --cask vibestudio` instead.

            **Windows** — download the `.exe` installer below. It is not yet code signed,
            so SmartScreen will warn on first run.

            **Updating** — the desktop app checks for new releases and keeps its update
            notification visible until dismissed. Windows offers to download, install,
            and restart. Linux and Homebrew offer **Install update** plus **Copy upgrade
            command** for manual control. Linux upgrades refresh repository metadata;
            if the package repository is still behind, the app tells you instead of
            claiming the update succeeded. After a package upgrade, choose **Restart now**.

            **Arch, or any distro without a repository** — the `.pkg.tar.zst`, `.rpm` and
            `.deb` files below install directly. Every packaged format carries the AppArmor
            profile that a workspace sandbox needs on Ubuntu 24.04+.

            **A server on a host we do not package** — npm carries the headless server and
            CLI, and needs Node.js 22.19+.

            ```sh
            npm install -g @panticonic/vibestudio-server
            ```

  publish-linux:
    name: Verify and publish Linux installers
    # release-quality includes both architectures, pre-tag signature verification,
    # and every other required check; publication only attaches the signed candidate.
    needs: [github-release, release-quality]
    if: ${{ vars.RELEASE_LINUX == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download immutable Linux release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-linux-release-${{ inputs.source-sha }}
          path: release

      - name: Verify Linux installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-linux

      - name: Attach Linux installers to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          files: |
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS-linux

  publish-macos:
    name: Verify and publish macOS DMG
    needs: [github-release, release-quality]
    if: ${{ vars.RELEASE_MAC == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download immutable macOS release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-macos-${{ inputs.source-sha }}
          path: release

      - name: Verify DMG checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-macos

      - name: Download Darwin process observer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-release-${{ inputs.source-sha }}
          path: release

      - name: Verify Darwin process observer candidate
        working-directory: release
        run: sha256sum --check SHA256SUMS-darwin-process-observers

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          files: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/macos-signing.txt
            release/SHA256SUMS-macos
            release/darwin-process-observers.tar.gz
            release/SHA256SUMS-darwin-process-observers

  publish-windows:
    name: Verify and publish Windows installer
    needs: [github-release, release-quality]
    if: ${{ vars.RELEASE_WINDOWS == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download immutable Windows release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibestudio-windows-${{ inputs.source-sha }}
          path: release
      - name: Verify installer checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS-windows
      - name: Attach installer to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.release-tag }}
          draft: true
          files: |
            release/*.exe
            release/latest.yml
            release/SHA256SUMS-windows

  publish-release:
    name: Publish the verified release
    needs: [github-release, publish-linux, publish-macos, publish-windows]
    if: >-
      ${{ !cancelled() && needs.github-release.result == 'success'
        && (vars.RELEASE_LINUX != 'true' || needs.publish-linux.result == 'success')
        && (vars.RELEASE_MAC != 'true' || needs.publish-macos.result == 'success')
        && (vars.RELEASE_WINDOWS != 'true' || needs.publish-windows.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Make the complete release public and latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
