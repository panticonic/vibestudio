name: Prepare Linux CI quality inputs

on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        default: main

permissions: {}

jobs:
  prepare:
    name: Prepare exact Linux quality inputs
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout current Base template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panticonic/vibestudio-base
          ref: ${{ inputs.base-ref || 'main' }}
          path: vibestudio-templates/base
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Build shared infrastructure packages
        run: pnpm build:infrastructure

      - name: Record exact host and template inputs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/ci-quality-inputs.mjs write "$SOURCE_SHA" "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Archive verified quality inputs
        run: |
          shopt -s nullglob
          package_dists=(packages/*/dist)
          test "${#package_dists[@]}" -gt 0
          tar -cf quality-inputs.tar .cache/ci-quality-inputs.json .cache/vibestudio-infrastructure-build.json vibestudio-templates "${package_dists[@]}"

      - name: Upload exact quality inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-quality-inputs-${{ github.sha }}
          path: quality-inputs.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Stage exact quality input manifest
        run: cp .cache/ci-quality-inputs.json release-quality-inputs.json

      - name: Upload exact quality input manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-quality-manifest-${{ github.sha }}
          path: release-quality-inputs.json
          if-no-files-found: error
          retention-days: 14

