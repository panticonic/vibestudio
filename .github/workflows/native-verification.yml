name: Verify native workspace execution

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true
      base-ref:
        type: string
        default: main

permissions: {}

jobs:
  verify:
    name: Verify ${{ inputs.target }} on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install test dependencies
        run: pnpm install --frozen-lockfile

      - name: Download prepared native release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-${{ inputs.target }}
          path: native/isolation/artifacts/native-isolation-${{ inputs.target }}

      - name: Download source-attested Darwin process observers
        if: ${{ inputs.target == 'darwin-arm64' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: dist/native-process-observer

      - name: Prepare and exercise native dependencies
        run: pnpm check:native-host-dependencies --repair

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Build production application and headless host
        id: production-build
        run: pnpm build

      - name: Use prepared native release input
        env:
          NATIVE_TARGET: ${{ inputs.target }}
        run: |
          node --input-type=module <<'NODE'
          import { assertNativeIsolationArtifacts, nativeIsolationTarget } from "./scripts/native-isolation-artifacts.mjs";
          const [platform, arch] = process.env.NATIVE_TARGET.split("-");
          assertNativeIsolationArtifacts(process.cwd(), undefined, [nativeIsolationTarget(platform, arch)]);
          NODE
          cp native/isolation/artifacts/native-isolation-${{ inputs.target }}/* dist/mxc/${{ inputs.target }}/
          if [ "${{ inputs.target }}" = "darwin-arm64" ]; then
            chmod 0755 dist/mxc/${{ inputs.target }}/mxc-exec-mac
          else
            chmod 0755 dist/mxc/${{ inputs.target }}/lxc-exec
          fi

      - name: Check native execution and platform permissions
        id: native-check
        run: pnpm vitest run --config packages/process-adapter/vitest.native.config.ts --reporter=default --reporter=json --outputFile=.cache/native-acceptance.json

      - name: Upload native acceptance report
        if: ${{ !cancelled() && (steps.native-check.outcome == 'success' || steps.native-check.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-acceptance-${{ inputs.target }}-${{ inputs.runner }}
          path: .cache/native-acceptance.json
          if-no-files-found: error
          retention-days: 7

      - name: Diagnose macOS sandbox denials
        if: ${{ failure() && runner.os == 'macOS' && steps.native-check.outcome == 'failure' }}
        run: sudo log show --last 3m --style compact --predicate 'eventMessage CONTAINS "Sandbox" AND eventMessage CONTAINS "deny"' | tail -100

      - name: Checkout Base template for desktop integration
        id: desktop-template-base
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.production-build.outcome == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: panticonic/vibestudio-base
          ref: ${{ inputs.base-ref }}
          path: vibestudio-templates/base
          persist-credentials: false

      - name: Acquire complete template source set for desktop integration
        id: desktop-templates
        if: ${{ !cancelled() && steps.desktop-template-base.outcome == 'success' }}
        shell: bash
        run: pnpm dev:templates setup "$GITHUB_WORKSPACE/vibestudio-templates"

      - name: Desktop pairing, approvals, panels, relaunch, and recovery
        id: desktop-smoke
        if: ${{ !cancelled() && steps.desktop-templates.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p test-results/desktop-pairing-smoke
          sudo tcpdump -i lo0 -n -l -tttt 'tcp[tcpflags] & (tcp-syn|tcp-fin|tcp-rst) != 0' > test-results/desktop-pairing-smoke/transport-diagnostics.log 2>&1 &
          capture_pid=$!
          trap 'sudo kill -TERM "$capture_pid"; wait "$capture_pid" || true' EXIT
          node scripts/desktop-pairing-smoke.mjs --template-checkouts "$GITHUB_WORKSPACE/vibestudio-templates"

      - name: Retain native HTTP connection evidence
        if: ${{ !cancelled() && (steps.desktop-smoke.outcome == 'success' || steps.desktop-smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-http-connections-${{ inputs.target }}-${{ inputs.runner }}
          path: test-results/desktop-pairing-smoke/transport-diagnostics.log
          if-no-files-found: error
          retention-days: 3

      - name: Retain desktop onboarding failure evidence
        if: ${{ !cancelled() && steps.desktop-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-onboarding-diagnostics-${{ inputs.target }}-${{ inputs.runner }}
          path: |
            test-results/desktop-pairing-smoke/*diagnostics-*.json
            test-results/desktop-pairing-smoke/desktop-*.png
          if-no-files-found: warn
          retention-days: 3
