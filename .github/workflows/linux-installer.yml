name: Build Linux installer candidate

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      arch:
        type: string
        required: true

permissions: {}

jobs:
  package:
    name: Package Linux ${{ inputs.arch }} installers
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches the committed package version
        run: node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"

      - name: Download this architecture's tested MXC payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-isolation-linux-${{ inputs.arch }}
          path: native/isolation/artifacts/native-isolation-linux-${{ inputs.arch }}

      - name: Install Linux packaging tools
        # electron-builder shells out to fpm, which needs rpmbuild for rpm and
        # libarchive's bsdtar for pacman. deb needs neither.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools bubblewrap

      - name: Allow packaged MXC user namespaces for release prebuilds
        run: |
          profile="$RUNNER_TEMP/vibestudio-release-mxc.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile vibestudio_release_mxc "$GITHUB_WORKSPACE/release/.package-linux-*/linux*-unpacked/resources/app.asar.unpacked/dist/mxc/linux-${{ inputs.arch }}/lxc-exec" flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -m 0644 "$profile" /etc/apparmor.d/vibestudio-release-mxc
          sudo apparmor_parser -r /etc/apparmor.d/vibestudio-release-mxc

      - name: Build Linux installers
        run: pnpm dist:linux

      - name: Generate installer checksums
        run: |
          cd release
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*-${{ inputs.arch }}.deb" | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*-${{ inputs.arch }}.rpm" | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*-${{ inputs.arch }}.pkg.tar.zst" | wc -l)" -eq 1
          find . -maxdepth 1 -type f \
            \( -name "vibestudio-*-${{ inputs.arch }}.deb" -o -name "vibestudio-*-${{ inputs.arch }}.rpm" -o -name "vibestudio-*-${{ inputs.arch }}.pkg.tar.zst" \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-linux-${{ inputs.arch }}
          test -s SHA256SUMS-linux-${{ inputs.arch }}

      - name: Upload immutable Linux release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibestudio-linux-${{ inputs.arch }}-${{ github.sha }}
          path: |
            release/vibestudio-*-${{ inputs.arch }}.deb
            release/vibestudio-*-${{ inputs.arch }}.rpm
            release/vibestudio-*-${{ inputs.arch }}.pkg.tar.zst
            release/SHA256SUMS-linux-${{ inputs.arch }}
          if-no-files-found: error
          retention-days: 7
