name: Build Linux installer candidates

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      arch:
        type: string
        required: true
      release-tag:
        type: string
        default: ""

permissions: {}

jobs:
  app:
    name: Prepare Linux ${{ inputs.arch }} application once
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify requested release version and source commit
        if: ${{ inputs.release-tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG" --source-sha "$SOURCE_SHA"

      - name: Download this architecture's tested MXC payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-isolation-linux-${{ inputs.arch }}-${{ github.sha }}
          path: native/isolation/artifacts/native-isolation-linux-${{ inputs.arch }}

      - name: Install Linux application runtime
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y bubblewrap

      - name: Resolve electron-builder's application directory for this architecture
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          app_directory=$(node scripts/package-desktop.mjs linux app-path "$ARCH")
          echo "LINUX_APP_DIRECTORY=$app_directory" >> "$GITHUB_ENV"

      - name: Allow packaged MXC user namespaces for application preparation
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          profile="$RUNNER_TEMP/vibestudio-release-mxc.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile vibestudio_release_mxc "$GITHUB_WORKSPACE/release/.package-linux-$ARCH-*/$LINUX_APP_DIRECTORY/resources/app.asar.unpacked/dist/mxc/linux-$ARCH/lxc-exec" flags=(unconfined) {
            userns,
          }
          EOF
          sudo install -m 0644 "$profile" /etc/apparmor.d/vibestudio-release-mxc
          sudo apparmor_parser -r /etc/apparmor.d/vibestudio-release-mxc

      - name: Build exact Linux application and prepare its installed workspace release
        env:
          ARCH: ${{ inputs.arch }}
        run: pnpm generate:workspace-template-release && pnpm build && node scripts/package-desktop.mjs linux app "$ARCH"

      - name: Archive the immutable prepared application
        run: |
          shopt -s nullglob
          package_dists=(packages/*/dist)
          test "${#package_dists[@]}" -gt 0
          tar -cf linux-app.tar release/linux-unpacked "${package_dists[@]}"

      - name: Upload exact Linux application for independent format packaging
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-linux-app-${{ inputs.arch }}-${{ github.sha }}
          path: linux-app.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  format:
    name: Package Linux ${{ inputs.arch }} ${{ matrix.format }} installer
    needs: app
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        format: [deb, rpm, pacman]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact prepared Linux application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibestudio-linux-app-${{ inputs.arch }}-${{ github.sha }}
          path: .cache/linux-app

      - name: Restore private application copy for this format
        run: tar -xf .cache/linux-app/linux-app.tar -C .

      - name: Install Linux package-format tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools

      - name: Package one installer from the prepared application
        env:
          ARCH: ${{ inputs.arch }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: node scripts/package-desktop.mjs linux format "$PACKAGE_FORMAT" release/linux-unpacked "$ARCH"

      - name: Verify this format produced exactly one installer
        shell: bash
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          case "$PACKAGE_FORMAT" in
            deb) pattern='vibestudio-*.deb' ;;
            rpm) pattern='vibestudio-*.rpm' ;;
            pacman) pattern='vibestudio-*.pkg.tar.zst' ;;
            *) echo "Unsupported Linux package format: $PACKAGE_FORMAT" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          files=(release/$pattern)
          test "${#files[@]}" -eq 1

      - name: Upload one immutable Linux format candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-linux-${{ inputs.arch }}-${{ github.sha }}-${{ matrix.format }}
          path: |
            release/vibestudio-*.deb
            release/vibestudio-*.rpm
            release/vibestudio-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  candidate:
    name: Assemble Linux ${{ inputs.arch }} release candidate
    needs: format
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Download all exact Linux format candidates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vibestudio-linux-${{ inputs.arch }}-${{ github.sha }}-*
          merge-multiple: true
          path: release

      - name: Generate installer checksums
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          cd release
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*.deb" | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*.rpm" | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name "vibestudio-*.pkg.tar.zst" | wc -l)" -eq 1
          find . -maxdepth 1 -type f \
            \( -name "vibestudio-*.deb" -o -name "vibestudio-*.rpm" -o -name "vibestudio-*.pkg.tar.zst" \) \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "SHA256SUMS-linux-$ARCH"
          test -s "SHA256SUMS-linux-$ARCH"

      - name: Upload immutable Linux release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibestudio-linux-${{ inputs.arch }}-${{ github.sha }}
          path: |
            release/vibestudio-*.deb
            release/vibestudio-*.rpm
            release/vibestudio-*.pkg.tar.zst
            release/SHA256SUMS-linux-${{ inputs.arch }}
          if-no-files-found: error
          retention-days: 7
