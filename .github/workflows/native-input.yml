name: Prepare native release input

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      target:
        type: string
        required: true

permissions: {}

jobs:
  prepare:
    name: Prepare ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare MXC executor payload
        run: node scripts/build-native-isolation.mjs

      - name: Prepare both Darwin process-group observers
        if: ${{ inputs.target == 'darwin-arm64' }}
        run: pnpm prepare:darwin-process-observers

      - name: Verify Darwin terminal process-group observation
        if: ${{ inputs.target == 'darwin-arm64' }}
        run: node --test --test-name-pattern='Darwin terminal confirmation' scripts/native-host-dependencies.test.mjs

      - name: Upload prepared native release input for this workflow revision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-isolation-${{ inputs.target }}-${{ github.sha }}
          path: dist/mxc/${{ inputs.target }}/
          if-no-files-found: error
          retention-days: 30

      - name: Upload source-attested Darwin process observer candidate
        if: ${{ inputs.target == 'darwin-arm64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-process-observers-ci-${{ github.sha }}
          path: |
            dist/native-process-observer/darwin-arm64/**
            dist/native-process-observer/darwin-x64/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
