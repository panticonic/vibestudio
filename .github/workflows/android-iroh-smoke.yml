name: Android Iroh UX and recovery

on:
  workflow_call:

permissions: {}

jobs:
  android-iroh-smoke:
    name: Android Iroh UX and recovery
    runs-on: ubuntu-24.04
    env:
      VIBESTUDIO_TEMPLATE_CHECKOUTS: ${{ github.workspace }}/vibestudio-templates
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Acquire complete template source set
        run: pnpm dev:templates setup "$VIBESTUDIO_TEMPLATE_CHECKOUTS"

      - name: Set up Linux mobile source runtime
        uses: ./.github/actions/setup-linux-source-runtime

      - name: Grant the runner its KVM device access
        shell: bash
        run: |
          set -euo pipefail
          kvm_device=/dev/kvm
          if [[ ! -c "$kvm_device" ]]; then
            echo "Android x86_64 emulator requires the runner's KVM device" >&2
            exit 1
          fi
          if ! command -v setfacl >/dev/null 2>&1; then
            echo "The runner image must provide setfacl to grant scoped KVM access" >&2
            exit 1
          fi

          sudo setfacl -m "u:$(id -u):rw" "$kvm_device"
          if [[ ! -r "$kvm_device" || ! -w "$kvm_device" ]]; then
            echo "The runner still cannot read and write $kvm_device" >&2
            exit 1
          fi

      - name: Android Iroh pairing, approvals, panel lifecycle, and recovery
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          pre-emulator-launch-script: |
            set -eu
            "$ANDROID_HOME/emulator/emulator" -accel-check
          script: pnpm test:iroh-mobile-e2e

      # This smoke compiles checked-in public System mobile source in isolated
      # test mode. Runtime provider credentials are not embedded in the bundle.
      - name: Upload Android bundle failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-bundle-failure-${{ github.run_id }}
          path: test-results/mobile-smoke/bundle-failure-*/*
          if-no-files-found: ignore
          retention-days: 3
